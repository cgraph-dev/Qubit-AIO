  t293: "/approve session|always runs a pending dangerous command with your chosen trust scope; /deny rejects it."
  t294: "/restart gracefully restarts the gateway after draining active runs, then pings the requester when back up."
  t295: "/kanban boards switch <slug> changes the active multi-project Kanban board from inside chat."
  t296: "/reload reloads ~/.qubit/.env into the running session — pick up new API keys without restarting."
  t297: "cronjob with no_agent=True runs a script on schedule and sends its stdout directly — zero tokens, zero LLM."
  t298: "An empty cron script stdout means silent tick — nothing is delivered, perfect for threshold watchdogs."
  t299: "QUBIT_CRON_MAX_PARALLEL (default 4) caps how many cron jobs run per tick so bursts don't saturate your keys."
  t300: "Gateway hooks live under ~/.qubit/hooks/<name>/ with HOOK.yaml + handler.py — handler must be named `handle`."
  t301: "Hook events include gateway:startup, session:start, agent:step, and command:* wildcard subscriptions."
  t302: "Drop a ~/.qubit/BOOT.md checklist and a gateway:startup hook runs it as a one-shot agent every boot."
  t303: "qubit curator run --dry-run previews what the curator would archive or consolidate without mutating anything."
  t304: "qubit curator pin <skill> hard-fences a skill against both auto-archival and the agent's skill_manage tool."
  t305: "qubit curator rollback restores skills from a pre-run snapshot — backups live under skills/.curator_backups/."
  t306: "qubit auth reset <provider> [target] clears cooldowns and exhaustion flags on a whole credential pool, or on one credential by index, id, or label."
  t307: "credential_pool_strategies.<provider>: round_robin cycles keys evenly instead of the fill_first default."
  t308: "use_gateway: true per-tool routes web, image, tts, or browser through your Qubit subscription — no extra keys."
  t309: "provider_routing.data_collection: deny excludes data-storing providers on OpenRouter."
  t310: "provider_routing.require_parameters: true only routes to providers that support every param in your request."
  t311: "QUBIT_TUI_RESUME=1 auto-re-attaches to the most recent TUI session on launch — handy after SSH drops."
  t312: "QUBIT_TUI_THEME=light|dark|<hex> forces the TUI theme on terminals that don't set COLORFGBG."
  t313: "Ctrl+G or Ctrl+X Ctrl+E in the TUI opens the input buffer in $EDITOR for long multi-line prompts."
  t314: "The TUI renders LaTeX inline — $E=mc^2$ becomes Unicode math instead of raw TeX."
  t315: "qubit dashboard launches a local web UI at 127.0.0.1:9119 — zero data leaves localhost."
  t316: "qubit dashboard embeds the full Qubit TUI in your browser via xterm.js and a WebSocket PTY."
  t317: "Drop a YAML in ~/.qubit/dashboard-themes/ with two palette colors to reskin the entire dashboard."
  t318: "Dashboard plugins are drop-in: manifest.json + JS bundle in ~/.qubit/dashboard-plugins/ — no npm build required."
  t319: "layoutVariant: cockpit in a dashboard theme adds a 260px left rail that plugins can populate via the sidebar slot."
  t320: "display.tool_progress_command: true exposes /verbose on messaging platforms; it's CLI-only by default."
  t321: "QUBIT_BACKGROUND_NOTIFICATIONS=result only pings when background tasks finish (vs concise/all/error/off)."
  t322: "QUBIT_WRITE_SAFE_ROOT restricts write_file/patch to directory prefixes; multiple paths via os.pathsep (: or ;)."
  t323: "QUBIT_IGNORE_RULES skips auto-injection of AGENTS.md, SOUL.md, .cursorrules, memory, and preloaded skills."
  t324: "QUBIT_ACCEPT_HOOKS auto-approves unseen shell hooks declared in config.yaml without a TTY prompt."
  t325: "auxiliary.goal_judge.model routes the /goal judge to a cheap fast model to keep loop cost near zero."
  t326: "Checkpoints skip directories with more than 50,000 files to avoid slow git operations on massive monorepos."
  t327: "tts.provider: piper runs 44-language local TTS on CPU — voices auto-download to ~/.qubit/cache/piper-voices/."
  t328: "tts.providers.<name>.type: command wires any CLI TTS engine with {input_path} and {output_path} placeholders."
  t329: "API_SERVER_ENABLED=true runs an OpenAI-compatible endpoint alongside the gateway for Open WebUI and LibreChat."
  t330: "GATEWAY_PROXY_URL runs a split setup: platform I/O locally, agent work delegated to a remote API server."
  t331: "MATRIX_DEVICE_ID pins a stable device ID for E2EE — without it, keys rotate every start and historic decrypt breaks."
  t332: "TELEGRAM_WEBHOOK_SECRET is required whenever TELEGRAM_WEBHOOK_URL is set — generate with openssl rand -hex 32."
  t333: "batch_runner.py --resume content-matches completed prompts by text so dataset reorders don't re-run finished work."
  t334: "/new starts a fresh session in place (alias /reset) — fresh session ID, clean history, CLI stays open."
  t335: "/clear wipes the terminal screen AND starts a new session — one shortcut for a visual reset."
  t336: "/history prints the current conversation in-line without leaving the CLI — useful for a quick re-read."
  t337: "/save writes the current conversation to disk without ending the session."
  t338: "/status shows session info at a glance: ID, title, model, token usage, and elapsed time."
  t339: "/image <path> attaches a local image file for your next prompt without pasting or drag-and-drop."
  t340: "/platforms shows gateway and messaging-platform connection status right from inside chat."
  t341: "/commands paginates the full slash-command + installed-skill list — useful on platforms without tab completion."
  t342: "/toolsets lists every available toolset so you know what -t/--toolsets accepts."
  t343: "/voice tts toggles TTS-only mode — agent replies out loud but you still type your prompts."
  t344: "/reload-skills re-scans ~/.qubit/skills/ so drop-in skills appear without restarting the session."
  t345: "/indicator kaomoji|emoji|unicode|ascii picks the TUI busy-indicator style shown during agent runs."
  t346: "/debug uploads a support bundle (system info + logs) and returns shareable links — works in chat too."
  t347: "qubit -z \"<prompt>\" is the purest one-shot: final answer on stdout, nothing else — ideal for piping in scripts."
  t348: "qubit chat --pass-session-id injects the session ID into the system prompt so the agent can self-reference it."
  t349: "qubit chat --image path/to/pic.png attaches a local image to a single -q query without a separate upload step."
  t350: "qubit chat --ignore-user-config skips the active user config — reproducible bug reports and CI runs."
  t351: "qubit chat --source tool tags programmatic chats so they don't clutter qubit sessions list."
  t352: "qubit dump --show-keys includes redacted API key fingerprints for deeper support debugging."
  t353: "qubit sessions rename <ID> \"new title\" renames any past session; qubit sessions delete <ID> removes one."
  t354: "qubit import restores a full Qubit backup zip; session JSON/JSONL exports import from the dashboard Sessions page."
  t355: "qubit fallback manages the fallback_model chain interactively — no hand-editing config.yaml."
  t356: "qubit pairing rotates the DM pairing token — the first messager after rotation claims access to the bot."
  t357: "qubit setup walks first-time users through provider, keys, and platform wiring in one interactive flow."
  t358: "qubit status --deep runs the full health sweep across every component; plain qubit status is the quick view."
  t359: "QUBIT_AGENT_TIMEOUT=0 disables the gateway inactivity kill for a running agent — use for long research runs."
  t360: "QUBIT_ENABLE_PROJECT_PLUGINS=1 auto-loads repo-local plugins from ./.qubit/plugins/ — trust-gated by design."
  t361: "QUBIT_DISABLE_FILE_STATE_GUARD=1 turns off the 'file changed since you read it' guard on patch and write_file."
  t362: "QUBIT_ALLOW_PRIVATE_URLS=true lets web tools hit localhost and private networks — off by default in gateway mode."
  t363: "QUBIT_OPTIONAL_SKILLS=name1,name2 auto-installs extra optional-catalog skills on first run per profile."
  t364: "QUBIT_BUNDLED_SKILLS points at a custom bundled-skill tree — used by Homebrew and Nix packaging."
  t365: "QUBIT_DUMP_REQUEST_STDOUT=1 dumps every API request payload to stdout instead of log files."
  t366: "QUBIT_OAUTH_TRACE=1 logs redacted OAuth token exchange and refresh attempts for debugging provider auth."
  t367: "QUBIT_STREAM_RETRIES (default 3) controls mid-stream reconnect attempts on transient network errors."
  t368: "QUBIT_GATEWAY_BUSY_ACK_ENABLED=false silences the ⚡/⏳/⏩ ack messages when a user messages a busy agent."
  t369: "QUBIT_AGENT_NOTIFY_INTERVAL (default 180s) sets how often the gateway pings with progress on long turns."
  t370: "QUBIT_RESTART_DRAIN_TIMEOUT (default 900s) caps how long /restart waits for in-flight runs before forcing."
  t371: "QUBIT_CHECKPOINT_TIMEOUT (default 30s) caps filesystem checkpoint creation — raise it on huge monorepos."
  t372: "image_gen.model in config.yaml picks the FAL model: flux-2/klein, gpt-image-2, nano-banana-pro, and more."
  t373: "image_gen.provider routes image generation through a plugin (OpenAI Images, Codex, FAL) instead of the default."
  t374: "AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY point vision analysis at any OpenAI-compatible endpoint."
  t375: "security.tirith_fail_open: false makes Qubit block commands when the tirith scanner itself errors out."
  t376: "TIRITH_FAIL_OPEN env var overrides the tirith_fail_open config — a quick toggle without editing config.yaml."
  t377: "--source tool chats are excluded from qubit sessions list by default — set --source explicitly to see them."
  t378: "Session IDs are timestamp-prefixed (20250305_091523_abcd) so sorting works naturally in ls and jq."
  t379: "API_SERVER_MODEL_NAME customizes the model name on /v1/models — essential for multi-profile Open WebUI setups."
  t380: "Dashboard plugins are served from /dashboard-plugins/<name>/ — drop files into ~/.qubit/dashboard-plugins/."
  # Empty-composer example prompts (TUI). Generic on purpose: Qubit is not coding-only.
  placeholder:
    p01: "Ask anything, or type / for commands…"
    p02: "Summarize what's in this folder"
    p03: "Draft a reply to the last email in my inbox"
    p04: "Plan a feature, then build it step by step"
    p05: "Find and fix a failing test"
    p06: "Research this topic and write me a brief"
    p07: "What changed in this repo recently?"
    p08: "Turn these notes into a to-do list"
    p09: "Explain this error and how to fix it"
    p10: "Set a reminder or schedule a recurring task"
    p11: "Type / to browse commands, or Ctrl+P for the palette"
