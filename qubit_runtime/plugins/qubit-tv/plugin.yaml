name: qubit-tv
version: 0.2.0
description: QubitTV desktop player and seven session-scoped media tools (context, control, transcript, download, jobs) adapted from the MIT-licensed HermesTV experimental preview.
author: Qubit adaptation of HermesTV (MIT, Copyright (c) 2025 Nous Research)
entrypoint: __init__.py
provides_tools:
  - qubit_tv_context
  - qubit_tv_control
  - qubit_tv_transcript
  - qubit_tv_download
  - qubit_tv_jobs
  - qubit_tv_job_status
  - qubit_tv_job_cancel
