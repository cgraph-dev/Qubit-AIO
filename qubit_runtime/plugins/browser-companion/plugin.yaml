name: browser-companion
version: 0.4.0
manifest_version: 2
api_version: 1
description: >-
  The Qubit side of the browser companion extension: gives the agent the browser
  context a turn carries (Browser Context Protocol v2) through three owner-scoped,
  consume-once tools. Fail-soft: with no browser context attached, every tool
  reports unavailable. Browser control (tab_* actions) is NOT part of this plugin
  — Qubit's own browser_* tools already route to an attached extension controller.
author: Qubit
license: MIT
tags: [browser, browser-extension, context]

# Backend, not standalone: a bundled ``backend`` plugin auto-loads on discovery,
# while a bundled ``standalone`` one is opt-in through ``plugins.enabled``. This
# plugin is native and always present, exactly like its siblings below it.
kind: backend

# No privileged host surface is requested: the plugin registers its own tools,
# overrides no built-in tool, makes no host-owned LLM call, acts on no chat
# platform and reads no credential.
capabilities: []

provides_tools:
  - browser_context_status
  - browser_get_context
  - browser_clear_context

provides_hooks:
  - pre_llm_call
  - pre_tool_call
