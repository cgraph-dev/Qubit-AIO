<svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Qubit web/network icon: interconnected nodes -->
  <defs>
    <linearGradient id="webGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38BDF8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6EE7B7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Network nodes -->
  <circle cx="10" cy="10" r="2.5" fill="url(#webGrad)"/>
  <circle cx="4" cy="4" r="1.5" fill="#38BDF8"/>
  <circle cx="16" cy="4" r="1.5" fill="#6EE7B7"/>
  <circle cx="4" cy="16" r="1.5" fill="#6EE7B7"/>
  <circle cx="16" cy="16" r="1.5" fill="#38BDF8"/>
  
  <!-- Connecting lines -->
  <line x1="10" y1="10" x2="4" y2="4" stroke="url(#webGrad)" stroke-width="1" opacity="0.6"/>
  <line x1="10" y1="10" x2="16" y2="4" stroke="url(#webGrad)" stroke-width="1" opacity="0.6"/>
  <line x1="10" y1="10" x2="4" y2="16" stroke="url(#webGrad)" stroke-width="1" opacity="0.6"/>
  <line x1="10" y1="10" x2="16" y2="16" stroke="url(#webGrad)" stroke-width="1" opacity="0.6"/>
</svg>
