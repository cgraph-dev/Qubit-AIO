<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" role="img" aria-label="Yellow anime sparkle star">
  <defs>
    <linearGradient id="yellow" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#fffef3"/>
      <stop offset=".40" stop-color="#fffbb5"/>
      <stop offset=".72" stop-color="#ffe829"/>
      <stop offset="1" stop-color="#ffc40c"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
