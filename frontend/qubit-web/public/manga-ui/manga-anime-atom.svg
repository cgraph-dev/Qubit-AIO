<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="Glowing yellow anime atom sparkle">
<defs>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
  <stop stop-color="#fffef1"/><stop offset=".4" stop-color="#fff86f"/>
  <stop offset=".75" stop-color="#ffe224"/><stop offset="1" stop-color="#f8aa12"/>
 </linearGradient>
 <filter id="halo" x="-65%" y="-65%" width="230%" height="230%">
  <feGaussianBlur stdDeviation="1.8" result="glow"/>
  <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
</defs>
<!-- the two sweeping elliptical strokes read as an anime atom, not lightning -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
 <ellipse cx="40" cy="40" rx="32" ry="13" transform="rotate(-35 40 40)"
  stroke="#10051c" stroke-width="8"/>
 <ellipse cx="40" cy="40" rx="32" ry="13" transform="rotate(-35 40 40)"
  stroke="url(#gold)" stroke-width="4.5" filter="url(#halo)"/>
 <ellipse cx="40" cy="40" rx="32" ry="13" transform="rotate(35 40 40)"
  stroke="#10051c" stroke-width="7"/>
 <ellipse cx="40" cy="40" rx="32" ry="13" transform="rotate(35 40 40)"
  stroke="#ffda29" stroke-width="4" filter="url(#halo)"/>
</g>
<!-- symmetrical 4-point anime flash: no jagged teeth or distorted branches -->
<path d="M40 12 Q44.5 34.5 68 40 Q44.5 45.5 40 68 Q35.5 45.5 12 40 Q35.5 34.5 40 12Z"
 fill="#10051c" stroke="#10051c" stroke-width="5" stroke-linejoin="round"/>
<path d="M40 17 Q43.2 36.5 63 40 Q43.2 43.5 40 63 Q36.8 43.5 17 40 Q36.8 36.5 40 17Z"
 fill="url(#gold)" stroke="#fffbe7" stroke-width="1.5" filter="url(#halo)"/>
<circle cx="40" cy="40" r="5.5" fill="#fffdf2"/>
<circle cx="9" cy="22" r="3.5" fill="#fff3a0" stroke="#22051f" stroke-width="1.2"/>
<circle cx="73" cy="55" r="3.8" fill="#ffdf1c" stroke="#170617" stroke-width="1.2"/>
<path d="M64 4 66.5 11.5 74 14 66.5 16.5 64 24 61.5 16.5 54 14 61.5 11.5Z"
 fill="#fffefa" stroke="#ff4ac2" stroke-width="1.6"/>
</svg>