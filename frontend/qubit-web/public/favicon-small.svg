<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#04201f"/>
  <!-- Bold ring: the one silhouette that survives 16px. -->
  <circle cx="15" cy="15.5" r="8.6" fill="none" stroke="#2dd4bf" stroke-width="3.6"/>
  <!-- Nucleus in the negative space so it doesn't read as a plain "O". -->
  <circle cx="15" cy="15.5" r="2.6" fill="#eafffb"/>
  <!-- Tail: a single electron breaking out, which makes it a qubit not a letter. -->
  <circle cx="25.5" cy="6.5" r="3" fill="#ffe2c0"/>
</svg>