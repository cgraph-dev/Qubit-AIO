<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Dashboard — Reports</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font: 14px/1.5 system-ui, sans-serif; background:#0d1117; color:#e6edf3; min-height:100vh; }
  .wrap { max-width:860px; margin:0 auto; padding:16px; }
  header { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  h1 { font-size:18px; margin:0; }
  a { color:#58a6ff; text-decoration:none; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; background:#161b22; border:1px solid #21262d; border-radius:10px; padding:10px 12px; }
  .toolbar input, .toolbar select { padding:6px 8px; background:#0d1117; border:1px solid #30363d; color:#e6edf3; border-radius:6px; font-size:13px; }
  .toolbar input { flex:1; min-width:160px; }
  .toolbar button { padding:6px 12px; background:#1f6feb; border:none; color:#fff; border-radius:6px; cursor:pointer; font-size:13px; }
  .toolbar button.ghost { background:#21262d; border:1px solid #30363d; }
  .toolbar button.danger { background:#da3633; }
  #conn { font-size:12px; color:#8b949e; }
  #conn.live { color:#3fb950; }
  .meta { font-size:12px; color:#8b949e; margin-bottom:8px; }
  .card { border:1px solid #21262d; border-radius:12px; padding:14px 16px; margin:10px 0; background:#0d1117; }
  .card h3 { margin:0 0 6px; font-size:15px; }
  .card .k { font-size:11px; color:#8b949e; margin-bottom:8px; display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; }
  .badge { display:inline-block; padding:1px 7px; border-radius:10px; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
  .b-user { background:#1f6feb33; color:#58a6ff; border:1px solid #1f6feb66; }
  .b-summary { background:#3fb95022; color:#3fb950; border:1px solid #3fb95066; }
  .b-status { background:#8b949e22; color:#8b949e; border:1px solid #8b949e55; }
  .b-fail { background:#f8514922; color:#f85149; border:1px solid #f8514966; }
  .b-routing { background:#d2992233; color:#d29922; border:1px solid #d2992266; }
  .summary { background:#161b22; border-radius:8px; padding:10px 12px; margin-top:8px; white-space:pre-wrap; }
  .raw { background:#161b22; border-radius:8px; padding:10px 12px; margin-top:8px; white-space:pre-wrap; font-size:12px; max-height:320px; overflow:auto; }
  .empty { color:#8b949e; text-align:center; padding:40px 0; }
  details { margin-top:8px; }
  summary { font-size:12px; color:#8b949e; cursor:pointer; }
</style></head><body>
<div class="wrap">
  <header>
    <h1>📄 Voice Dashboard — Reports</h1>
    <span><a href="/">talk</a> · <a href="/activity">activity</a> · <a href="/reports">reports</a></span>
  </header>
  <div class="toolbar">
    <input id="q" placeholder="search reports (text, file, summary)…">
    <select id="cat"><option value="">all categories</option><option value="openclaw">openclaw</option><option value="hermes">hermes</option><option value="summary">summary</option><option value="local">local</option><option value="weather">weather</option><option value="inbox">inbox</option><option value="interrupt">interrupt</option></select>
    <select id="days"><option value="7">7 days</option><option value="30">30 days</option><option value="90" selected>90 days</option><option value="0">all time</option></select>
    <button id="refreshBtn">refresh</button>
    <button id="pruneBtn" class="ghost" title="delete reports older than selected days">prune old</button>
    <span id="conn">connecting…</span>
  </div>
  <div id="meta" class="meta"></div>
  <div id="feed"></div>
</div>
<script src="/static/vb.js"></script>
<script>
const BASE = (new URLSearchParams(location.search).get('api') || localStorage.getItem('vdb_api') || '').replace(/\/$/, '');
// Token comes ONLY from localStorage via the shared helper (frontend/vb.js).
const TOKEN = vbToken();
function hdrs(extra){ return vbHeaders(extra); }
function esc(s){ return (s||'').replace(/[&<>]/g, c=> ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function fmt(ts){ if(!ts) return ''; const d=new Date(ts*1000); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }

let lastItems=[];
// show sticky route hint at top (fetched via /api/status)
async function showSticky(){ try{ const r=await fetch(BASE+'/api/status',{headers:hdrs()}); if(r.ok){ const d=await r.json(); if(d.sticky_route) document.getElementById('meta').textContent = 'sticky route → '+d.sticky_route+' · '+(document.getElementById('meta').textContent||''); }}catch(_){} }
async function load(){
  const q=encodeURIComponent(document.getElementById('q').value.trim());
  const cat=encodeURIComponent(document.getElementById('cat').value);
  const days=encodeURIComponent(document.getElementById('days').value);
  const url = BASE + `/api/reports?q=${q}&category=${cat}&days=${days}&limit=200`;
  try{
    const r=await fetch(url, { headers: hdrs() });
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    lastItems=d.items||[];
    document.getElementById('conn').textContent='live · '+lastItems.length+' reports';
    document.getElementById('conn').className='live';
    document.getElementById('meta').textContent = lastItems.length ? `showing ${lastItems.length} reports · `+fmt(lastItems[0]?.ts)+' → '+fmt(lastItems[lastItems.length-1]?.ts) : 'no reports yet';
    render(lastItems);
  }catch(e){
    document.getElementById('conn').textContent='offline';
    document.getElementById('conn').className='';
    document.getElementById('feed').innerHTML='<div class="empty">bridge offline or no reports</div>';
  }
}
function render(items){
  const feed=document.getElementById('feed');
  if(!items.length){ feed.innerHTML='<div class="empty">no reports match your filters</div>'; return; }
  feed.innerHTML = items.map(it=>{
    const kind=it.kind||it.category||'status';
    const badge=`<span class="badge b-${esc(kind)}">${esc(kind)}</span>`;
    const cat = it.category ? ` · <span style="color:#8b949e;">${esc(it.category)}</span>` : '';
    const route = it.route ? ` · <span style="color:#d29922;">${esc(it.route)}</span>` : '';
    const text = it.text ? `<div style="white-space:pre-wrap;margin-top:6px;">${esc(it.text)}</div>` : '';
    const summary = it.summary ? `<div class="summary">${esc(it.summary)}</div>` : '';
    const err = it.error ? `<div class="summary" style="color:#f85149;background:#f8514911;">${esc(it.error)}</div>` : '';
    const detail = it.detail ? `<div style="font-size:11px;color:#8b949e;margin-top:4px;">${esc(it.detail)}</div>` : '';
    const raw = it.raw ? `<details><summary>raw output / evidence</summary><div class="raw">${esc(typeof it.raw==='string'?it.raw:JSON.stringify(it.raw,null,2))}</div></details>` : (it.raw_log ? `<details><summary>log event</summary><div class="raw">${esc(JSON.stringify(it.raw_log,null,2))}</div></details>` : '');
    return `<div class="card"><div class="k"><span>${fmt(it.ts)}</span>${badge}${cat}${route}</div>${text}${summary}${err}${detail}${raw}</div>`;
  }).join('');
}
document.getElementById('refreshBtn').addEventListener('click', load);
document.getElementById('q').addEventListener('keydown', e=>{ if(e.key==='Enter') load(); });
document.getElementById('cat').addEventListener('change', load);
document.getElementById('days').addEventListener('change', load);
document.getElementById('pruneBtn').addEventListener('click', async ()=>{
  const days=document.getElementById('days').value;
  if(!confirm(`Delete reports older than ${days} days?`)) return;
  try{ const r=await fetch(BASE+'/api/reports/prune', { method:'POST', headers: hdrs({'Content-Type':'application/json'}), body: JSON.stringify({days: parseInt(days,10)||90}) }); const d=await r.json(); alert('pruned '+d.removed+' items'); load(); }catch(e){ alert('prune failed: '+e.message); }
});
let t=null;
document.getElementById('q').addEventListener('input', ()=>{ clearTimeout(t); t=setTimeout(load, 400); });
load();
setInterval(load, 10000);
</script>
</body></html>
