<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voice Dashboard — Reports</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font: 14px/1.5 system-ui, sans-serif; background:#0d1117; color:#e6edf3; min-height:100vh; }
  .wrap { max-width:860px; margin:0 auto; padding:16px; }
  header { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  h1 { font-size:18px; margin:0; }
  a { color:#58a6ff; text-decoration:none; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; background:#161b22; border:1px solid #21262d; border-radius:10px; padding:10px 12px; }
  .toolbar input, .toolbar select { padding:6px 8px; background:#0d1117; border:1px solid #30363d; color:#e6edf3; border-radius:6px; font-size:13px; }
  .toolbar input { flex:1; min-width:160px; }
  .toolbar button { padding:6px 12px; background:#1f6feb; border:none; color:#fff; border-radius:6px; cursor:pointer; font-size:13px; }
  .toolbar button.ghost { background:#21262d; border:1px solid #30363d; }
  .toolbar button.danger { background:#da3633; }
  #conn { font-size:12px; color:#8b949e; }
  #conn.live { color:#3fb950; }
  .meta { font-size:12px; color:#8b949e; margin-bottom:8px; }
  .card { border:1px solid #21262d; border-radius:12px; padding:14px 16px; margin:10px 0; background:#0d1117; }
  .card h3 { margin:0 0 6px; font-size:15px; }
  .card .k { font-size:11px; color:#8b949e; margin-bottom:8px; display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; }
  .badge { display:inline-block; padding:1px 7px; border-radius:10px; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
  .b-user { background:#1f6feb33; color:#58a6ff; border:1px solid #1f6feb66; }
  .b-summary { background:#3fb95022; color:#3fb950; border:1px solid #3fb95066; }
  .b-status { background:#8b949e22; color:#8b949e; border:1px solid #8b949e55; }
  .b-fail { background:#f8514922; color:#f85149; border:1px solid #f8514966; }
  .b-routing { background:#d2992233; color:#d29922; border:1px solid #d2992266; }
  .summary { background:#161b22; border-radius:8px; padding:10px 12px; margin-top:8px; white-space:pre-wrap; }
  .raw { background:#161b22; border-radius:8px; padding:10px 12px; margin-top:8px; white-space:pre-wrap; font-size:12px; max-height:320px; overflow:auto; }
  .empty { color:#8b949e; text-align:center; padding:40px 0; }
  details { margin-top:8px; }
  summary { font-size:12px; color:#8b949e; cursor:pointer; }
</style><link rel="stylesheet" href="/static/app.css"></head><body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<main class="wrap" id="main-content" tabindex="-1">
  <header>
    <h1><span class="brand-mark" aria-hidden="true">Q</span> Voice Dashboard — Reports</h1>
    <nav class="page-nav" aria-label="Primary"><a class="nav-brand" href="/"><span class="brand-mark" aria-hidden="true">Q</span>Qubit</a><span class="nav-separator" aria-hidden="true"></span><a href="/">Talk</a><a href="/activity">Activity</a><a href="/reports" aria-current="page">Reports</a><a href="/settings">Settings</a><a class="nav-utility" href="/token-setup">Pair device</a></nav>
  </header>
  <div class="toolbar">
    <label class="sr-only" for="q">Search reports</label><input id="q" placeholder="search reports…">
    <label class="sr-only" for="platform">Platform filter</label><select id="platform"><option value="">all platforms</option><option value="gmail">gmail</option><option value="instagram">instagram</option><option value="messenger">messenger</option></select>
    <label class="sr-only" for="days">Retention: prune reports older than</label><select id="days"><option value="30">30 days</option><option value="90" selected>90 days</option></select>
    <button id="refreshBtn">refresh</button>
    <button id="pruneBtn" class="ghost" title="preview then delete expired report bundles (confirmation required)">retention</button>
    <span id="conn" aria-live="polite">connecting…</span>
  </div>
  <div id="meta" class="meta"></div>
  <div id="msg" class="meta" role="status" aria-live="polite"></div>
  <div id="feed"></div>
</main>
<script src="/static/vb.js"></script>
<script src="/static/ui.js"></script>
<script>
// Token comes ONLY from localStorage via the shared helper (frontend/vb.js).
vbResolveBase();
const msg = document.getElementById('msg');
function setMsg(text){ if (msg) msg.textContent = text || ''; }
function fmt(ts){ if(!ts) return ''; const d=new Date(ts*1000); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }

let lastItems=[];
// show sticky route hint at top (fetched via the shared helper /api/status)
async function showSticky(){
  const res = await vbApi('/api/status');
  if (res.ok && res.body && res.body.sticky_route) {
    const meta = document.getElementById('meta');
    if (meta) meta.textContent = 'sticky route → '+res.body.sticky_route+' · '+(meta.textContent||'');
  }
}
function statusBadge(status){
  const s = String(status||'unknown').toLowerCase();
  const colors = {success:'#3fb950', partial:'#d29922', degraded:'#f85149',
                  failed:'#f85149', missing:'#8b949e'};
  const c = colors[s] || '#8b949e';
  return vbBuild('span', {class:'badge', style:'background:'+c+'22;color:'+c+';border:1px solid '+c+'66'}, String(status||'unknown'));
}
// DOM-built report cards from the canonical bundle index (Packet 8C contract):
// every value is rendered via textContent (no innerHTML); the only links are
// safe generated report IDs opened in a new tab.
function reportCard(it){
  const head = vbBuild('div', {class:'k'});
  head.appendChild(vbBuild('span', null, fmt(it.created_at)));
  head.appendChild(statusBadge(it.status));
  head.appendChild(vbBuild('span', {class:'muted'}, ' · '+(it.platforms||[]).join(', ')||'all'));
  if (it.acknowledged) head.appendChild(vbBuild('span', {class:'muted'}, ' · acknowledged'));
  const title = vbBuild('h3', null, it.report_id || 'report');
  const meta = vbBuild('div', {class:'k'},
    vbBuild('span', null, 'new '+(it.new_count||0), ' · evidence '+(it.assets_available||0)+'/'+(it.assets_total||0)+' assets'));
  const card = vbBuild('div', {class:'card'}, head, title);
  if (it.summary) card.appendChild(vbBuild('div', {class:'summary'}, String(it.summary)));
  card.appendChild(meta);
  const open = vbBuild('a', {class:'tap-target', href: '/api/reports/'+encodeURIComponent(it.report_id)+'/html', target:'_blank', rel:'noopener'}, 'Open report (new tab)');
  card.appendChild(vbBuild('div', {style:'margin-top:6px'}, open));
  return card;
}
function emptyState(text){
  const feed=document.getElementById('feed');
  vbClear(feed);
  feed.appendChild(vbBuild('div', {class:'empty'}, text));
}
async function load(){
  const q=encodeURIComponent(document.getElementById('q').value.trim());
  const platform=encodeURIComponent(document.getElementById('platform').value);
  const res = await vbApi(`/api/reports?q=${q}&platform=${platform}&limit=200`);
  if (res.authRequired) {
    vbStatus('conn', 'not paired — open /token-setup', 'degraded');
    setMsg('Not paired with the bridge. Open Pair device and save your token.');
    return;
  }
  if (!res.ok || !res.body || !Array.isArray(res.body.reports)) {
    vbStatus('conn', 'offline', 'offline');
    setMsg(vbApiMessage(res) || 'Bridge offline or no reports.');
    emptyState('Bridge offline or no reports.');
    return;
  }
  lastItems=res.body.reports;
  vbStatus('conn', 'live · '+lastItems.length+' reports', 'live');
  const meta=document.getElementById('meta');
  if (meta) meta.textContent = lastItems.length
    ? `showing ${lastItems.length} report bundles`
    : 'no report bundles yet';
  setMsg('');
  render(lastItems);
}
function render(items){
  const feed=document.getElementById('feed');
  if(!items.length){ emptyState('no reports match your filters'); return; }
  vbClear(feed);
  items.forEach(it => feed.appendChild(reportCard(it)));
}
document.getElementById('refreshBtn').addEventListener('click', load);
document.getElementById('q').addEventListener('keydown', e=>{ if(e.key==='Enter') load(); });
document.getElementById('platform').addEventListener('change', load);
document.getElementById('days').addEventListener('change', load);
// Retention is fail-closed and dry-run by default (Packet 8C): preview what is
// EXPIRED, then require an explicit confirmation before applying. The backend
// deletes only backed-up, index-validated expired bundles.
document.getElementById('pruneBtn').addEventListener('click', async ()=>{
  const days=parseInt(document.getElementById('days').value,10)||90;
  const preview = await vbApi('/api/reports/prune', { method:'POST',
    body: JSON.stringify({days: days}) });
  if (preview.authRequired) { setMsg('Not paired — open Pair device and save your token.'); return; }
  if (!preview.ok || !preview.body) { setMsg(vbApiMessage(preview) || 'Retention preview failed.'); return; }
  const b = preview.body;
  const n = (b.candidates||[]).length;
  if (b.state && b.state.toLowerCase() !== 'ok') {
    setMsg('Retention blocked ('+String(b.state).toUpperCase()+'): nothing was deleted.');
    vbAnnounce('Retention blocked; nothing was deleted.');
    return;
  }
  if (!n) { setMsg('Nothing expired at '+days+' days (dry-run).'); return; }
  if (!confirm(`Retention: ${n} report bundle(s) older than ${days} days are expired. Back them up and delete them?`)) return;
  const apply = await vbApi('/api/reports/prune', { method:'POST',
    body: JSON.stringify({days: days, apply: true}) });
  if (apply.ok && apply.body) {
    const d = (apply.body.deleted||[]).length;
    const state = String(apply.body.state||'').toUpperCase();
    setMsg(state==='OK' ? `Retention applied: ${d} expired bundle(s) deleted.`
                        : `Retention ${state}: ${d} deleted, check failures.`);
    vbAnnounce(`Retention finished with ${d} bundles deleted.`);
  } else { setMsg(vbApiMessage(apply) || 'Retention failed.'); vbAnnounce('Retention failed.'); }
  load();
});
let t=null;
document.getElementById('q').addEventListener('input', ()=>{ clearTimeout(t); t=setTimeout(load, 400); });
load();
setInterval(load, 10000);
</script>
</body></html>
