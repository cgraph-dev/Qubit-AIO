<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FFCC;stop-opacity:1">
        <animate attributeName="stop-color" values="#00FFCC;#7CFC00;#00FFCC" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#7CFC00;stop-opacity:1">
        <animate attributeName="stop-color" values="#7CFC00;#00FFCC;#7CFC00" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Atom nucleus with pulse animation -->
  <circle cx="32" cy="32" r="4" fill="url(#glow)" filter="url(#neonGlow)">
    <animate attributeName="r" values="4;5;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.8;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Electron orbit 1 with rotation -->
  <ellipse cx="32" cy="32" rx="20" ry="8" fill="none" stroke="url(#glow)" stroke-width="1.5" filter="url(#neonGlow)" transform="rotate(0 32 32)">
    <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Electron 1 -->
  <circle r="2.5" fill="url(#glow)" filter="url(#neonGlow)">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 32,24 A 20,8 0 1,1 32,40 A 20,8 0 1,1 32,24 Z"/>
  </circle>
  
  <!-- Electron orbit 2 -->
  <ellipse cx="32" cy="32" rx="20" ry="8" fill="none" stroke="url(#glow)" stroke-width="1.5" filter="url(#neonGlow)" transform="rotate(60 32 32)">
    <animateTransform attributeName="transform" type="rotate" from="60 32 32" to="420 32 32" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite" begin="0.66s"/>
  </ellipse>
  
  <!-- Electron 2 -->
  <circle r="2.5" fill="url(#glow)" filter="url(#neonGlow)" transform="rotate(60 32 32)">
    <animateMotion dur="4s" repeatCount="indefinite" begin="1.33s" path="M 32,24 A 20,8 0 1,1 32,40 A 20,8 0 1,1 32,24 Z"/>
    <animateTransform attributeName="transform" type="rotate" from="60 32 32" to="420 32 32" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Electron orbit 3 -->
  <ellipse cx="32" cy="32" rx="20" ry="8" fill="none" stroke="url(#glow)" stroke-width="1.5" filter="url(#neonGlow)" transform="rotate(120 32 32)">
    <animateTransform attributeName="transform" type="rotate" from="120 32 32" to="480 32 32" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite" begin="1.33s"/>
  </ellipse>
  
  <!-- Electron 3 -->
  <circle r="2.5" fill="url(#glow)" filter="url(#neonGlow)" transform="rotate(120 32 32)">
    <animateMotion dur="4s" repeatCount="indefinite" begin="2.66s" path="M 32,24 A 20,8 0 1,1 32,40 A 20,8 0 1,1 32,24 Z"/>
    <animateTransform attributeName="transform" type="rotate" from="120 32 32" to="480 32 32" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
