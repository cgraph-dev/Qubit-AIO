[pytest]
markers =
    unit: hermetic unit/contract tests (no live services, no network)
    contract: pinned contract / packet boundary tests
    integration: HTTP/webui integration tests against a local server
    smoke: hermetic startup/dashboard/task/cancellation/voice smoke tests
    live: opt-in tests requiring a real model/browser/service (DEGRADED when skipped)
    monitor: opt-in long-running monitoring / clean-venv checks (never in normal runs)
    dashboard: live-dashboard probes against a running bridge
    ui: opt-in Packet 8L Playwright accessibility/responsive browser checks (excluded from hermetic default)
addopts = -m "not live and not dashboard and not monitor and not ui"