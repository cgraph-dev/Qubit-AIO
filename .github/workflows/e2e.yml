name: e2e

# Sharded end-to-end suite. Every shard runs a disjoint slice of the 157 E2E
# files in a fresh process tree; the release gate is the one full run, so CI
# keeps the runner count bounded by sharding rather than by weakening tests.
on:
  pull_request:
  push:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: E2E shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    concurrency:
      group: e2e-${{ github.workflow }}-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      SHARD: ${{ matrix.shard }}
      SHARDS: "8"
      TMPDIR: /tmp
      PYTHONPATH: ${{ github.workspace }}/qubit_runtime:${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install E2E system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bubblewrap tmux sqlite3 ffmpeg
          # Ubuntu 24 restricts unprivileged user namespaces; the upgrade
          # hand-off tests drive a real bwrap sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --dev-bind / / --proc /proc --unshare-pid -- true
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"             pytest-asyncio             "discord.py[voice]==2.7.1"             "aiohttp==3.14.4"             "python-telegram-bot[webhooks]==22.8"             "slack-bolt==1.30.0"             "slack-sdk==3.44.1"
      - name: Select this shard
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          files = sorted(Path("tests/e2e").rglob("test_*.py"))
          shard = int(os.environ["SHARD"]) - 1
          shards = int(os.environ["SHARDS"])
          selected = [str(p) for i, p in enumerate(files) if i % shards == shard]
          Path("/tmp/e2e-shard.txt").write_text("\n".join(selected) + "\n", encoding="utf-8")
          print(f"shard {shard + 1}/{shards}: {len(selected)} of {len(files)} files")
          if not selected:
              raise SystemExit("empty E2E shard")
          PY
        working-directory: qubit_runtime
      - name: Run this E2E shard
        run: |
          python scripts/run_tests_parallel.py \
            --files-from /tmp/e2e-shard.txt \
            -j 2 --file-timeout 1200 --file-retries 0
        working-directory: qubit_runtime
