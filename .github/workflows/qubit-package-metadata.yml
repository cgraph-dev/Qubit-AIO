name: Qubit root package metadata

on:
  pull_request:
    paths:
      - pyproject.toml
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - tests/test_root_package_metadata.py
      - .github/workflows/qubit-package-metadata.yml
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - tests/test_root_package_metadata.py
      - .github/workflows/qubit-package-metadata.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qubit-package-metadata-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  metadata:
    name: Root PEP 639 metadata regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate metadata without runtime dependencies
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path("tests/test_root_package_metadata.py")
          assert path.is_file(), "root metadata regression test is missing"
          spec = importlib.util.spec_from_file_location("qubit_metadata_test", path)
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.test_root_license_is_pep639_expression()
          PY
      - uses: ./.github/actions/check-clean-worktree
