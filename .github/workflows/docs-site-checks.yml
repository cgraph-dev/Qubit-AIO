name: Docs Site Checks

on:
  workflow_call:
    inputs:
      commit:
        description: Commit to test and build. Empty keeps the triggering commit.
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-site-checks:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs generators
        run: python -m pip install --upgrade pip ruamel.yaml ascii-guard

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: qubit_runtime/website/package-lock.json

      - name: Install website dependencies
        uses: ./.github/actions/retry
        with:
          command: npm ci
          working-directory: qubit_runtime/website

      - name: Extract skill metadata for dashboard
        run: python3 qubit_runtime/website/scripts/extract-skills.py

      - name: Regenerate per-skill docs pages + catalogs
        run: python3 qubit_runtime/website/scripts/generate-skill-docs.py

      - name: Committed skill docs match the generator
        # A regeneration that changes anything means the published catalogs/pages
        # are stale. Fix: run the generator and commit the result.
        run: |
          git add -N qubit_runtime/website/docs qubit_runtime/website/sidebars.ts
          if ! git diff --exit-code --stat -- qubit_runtime/website/docs qubit_runtime/website/sidebars.ts qubit_runtime/website/i18n; then
            echo "::error::qubit_runtime/website/scripts/generate-skill-docs.py output differs from the committed docs; run it and commit the result"
            exit 1
          fi

      - name: Check cross-page links resolve on GitHub and on the site
        run: python3 qubit_runtime/website/scripts/check_doc_links.py

      - name: Lint docs diagrams
        run: npm run lint:diagrams
        working-directory: qubit_runtime/website

      - name: Build Docusaurus (default locale)
        run: npm run build:fast
        working-directory: qubit_runtime/website
