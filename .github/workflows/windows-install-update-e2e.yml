name: windows-install-update-e2e
on:
  workflow_dispatch:
    inputs:
      strict_acceptance:
        description: "Acceptance owner list (1, upd-txn, ...); empty leaves known gaps excused"
        required: false
        default: ""
        type: string
  push:
    paths:
      - ".github/workflows/windows-install-update-e2e.yml"
      - "qubit_runtime/tests/e2e/core/windows_update/**"
      - "qubit_runtime/qubit_cli/**"
jobs:
  install-update:
    name: Windows install + update E2E
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest psutil pyyaml pathspec
      - name: Run Windows install + update E2E
        env:
          HERMES_E2E_STRICT_ACCEPTANCE: ${{ inputs.strict_acceptance }}
          HERMES_E2E_ARTIFACTS: ${{ runner.temp }}/qubit-e2e-artifacts
          QUBIT_E2E_WINDOWS_INSTALL: "1"
        run: >
          python -m pytest -q -p no:cacheprovider -m "platforms('windows')"
          tests/e2e/core/windows_update/
      - name: Every crash cell ran
        env:
          HERMES_E2E_ARTIFACTS: ${{ runner.temp }}/qubit-e2e-artifacts
        run: |
          if (-not $env:HERMES_E2E_ARTIFACTS) { throw "HERMES_E2E_ARTIFACTS is not set" }
          $manifest = Join-Path $env:HERMES_E2E_ARTIFACTS 'crash-cells-ran.txt'
          if (-not (Test-Path -LiteralPath $manifest)) {
            throw "the crash journey did not publish its manifest at $manifest"
          }
          $failed = @(Get-Content -LiteralPath $manifest | Where-Object { $_ -match ': failed$' })
          if ($failed.Count -gt 0) { throw "crash cell(s) did not run to a verdict: $($failed -join '; ')" }
          Write-Host (Get-Content -LiteralPath $manifest -Raw)
