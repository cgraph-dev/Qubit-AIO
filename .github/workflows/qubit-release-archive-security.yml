name: Qubit release archive security

on:
  pull_request:
    paths:
      - 'scripts/verify_public_release.py'
      - 'tests/test_verify_public_release.py'
      - '.github/workflows/qubit-release-archive-security.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/verify_public_release.py'
      - 'tests/test_verify_public_release.py'
      - '.github/workflows/qubit-release-archive-security.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qubit-release-archive-security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Release archive verifier regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install verifier test dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.4.2 PyYAML==6.0.2 uv==0.9.11
      - name: Test archive security and release verifier
        run: python -m pytest -q tests/test_verify_public_release.py
      - uses: ./.github/actions/check-clean-worktree
