name: Qubit regression gates

# Qubit-owned checks complement the upstream-derived runtime and E2E suites.
# Each lane is independent, so a queued large E2E matrix cannot hide failures.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qubit-regressions-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-verifier:
    name: Qubit release verification regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest==8.4.2
      - name: Verify release archive and published-asset checks
        run: python -m pytest -q tests/test_verify_public_release.py
      - uses: ./.github/actions/check-clean-worktree

  dashboard-log-search:
    name: Qubit dashboard log search regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/qubit_runtime:${{ github.workspace }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest==8.4.2
      - name: Run dashboard log search regression tests
        run: |
          if [ ! -f qubit_runtime/tests/test_dashboard_log_search.py ]; then
            echo "::notice::Dashboard log search regression suite not merged yet"
            exit 0
          fi
          python -m pytest -q qubit_runtime/tests/test_dashboard_log_search.py
      - uses: ./.github/actions/check-clean-worktree
