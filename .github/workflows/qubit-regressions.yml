name: Qubit regression gates

# Qubit-owned checks complement the upstream-derived runtime and E2E suites.
# This lightweight lane is independent of the large E2E matrix.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qubit-regressions-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-verifier:
    name: Qubit release verification regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest==8.4.2 PyYAML==6.0.2 uv==0.9.11
      - name: Verify release archive and clean-install gate contracts
        run: |
          python -m pytest -q \
            tests/test_verify_public_release.py \
            tests/test_release_fresh_install_gate.py \
            tests/test_clean_install_isolation.py \
            tests/test_dashboard_auth_contract.py
      - uses: ./.github/actions/check-clean-worktree

