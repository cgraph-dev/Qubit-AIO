name: Qubit regression gates

# Qubit-owned checks complement the upstream-derived runtime and E2E suites.
# This lightweight lane is independent of the large E2E matrix.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qubit-regressions-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-verifier:
    name: Qubit release verification regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest==8.4.2
      - name: Verify release archive and published-asset checks
        run: python -m pytest -q tests/test_verify_public_release.py
      - uses: ./.github/actions/check-clean-worktree

