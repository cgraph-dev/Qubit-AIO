[project]
name = "openclaw-voice-bridge"
version = "0.1.0"
description = "Local push-to-talk voice bridge for OpenClaw: ASR (faster-whisper), intent routing, gateway execution, local TTS. PersonaPlex-ready."
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1",
    "sounddevice>=0.4",
    "numpy>=1.24",
    "webrtcvad>=2.0.10",
    "websockets>=12",
    "pyyaml>=6",
    "piper-tts>=1.2",
    "sphn>=0.1.4,<0.2",   # PersonaPlex duplex: streaming ogg/opus (needs libopus-dev); 0.2.x changed the API
]

[project.optional-dependencies]
hotkey = ["pynput>=1.7"]
edge = ["edge-tts>=6"]
test = ["pytest>=8"]

[project.scripts]
voicebridge = "voicebridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voicebridge"]
