[project]
name = "qubit-voice-agent"
version = "1.0.0"
description = "Qubit Voice Agent — local push-to-talk voice agent: Moonshine ASR, Silero VAD, voice-ID, local LLM, piper TTS — 5 GB VRAM budget."
requires-python = ">=3.11"
dependencies = [
    "sherpa-onnx>=1.13",      # Moonshine ASR + Silero VAD + eres2net voice-ID + Kokoro
    "sounddevice>=0.4",       # mic capture + playback (PortAudio)
    "numpy>=1.24",            # 2.5-safe audio handled by voicebridge/audio/sndcompat.py
                              # (sounddevice 0.5.6 uses the deprecated in-place shape set)
    "cloudpickle>=3.0",       # serialize broker callable-tool closures for forkserver isolation
    "pyyaml>=6",
    "websockets>=12",         # OpenClaw gateway
    "piper-tts>=1.2",         # default TTS
    "faster-whisper>=1.1",    # optional ASR fallback (asr.provider: whisper)
    "webrtcvad>=2.0.10",      # optional VAD fallback (vad.backend: webrtc)
    "onnx>=1.14",             # Parakeet ONNX metadata patcher (scripts/install.sh) + guarded sherpa fallback
    "playwright>=1.49",       # browser inbox reader (Gmail/IG/FB/TikTok via persistent profiles)
]

[project.optional-dependencies]
hotkey = ["pynput>=1.7"]
edge = ["edge-tts>=6"]
kokoro = []                   # Kokoro TTS ships inside sherpa-onnx; model download only
test = ["pytest>=8"]

[project.scripts]
voicebridge = "voicebridge.cli:main"
qubit-dev = "voicebridge.terminal:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voicebridge"]
