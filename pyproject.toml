# Sdist mirror of the wheel's dev-tree pruning. Hatchling force-include walks a
# directory mapping recursively and only skips the names in its own
# EXCLUDED_DIRECTORIES set (which omits ``node_modules``), so the git-ignored
# ``qubit_runtime/ui-tui/node_modules`` tree would otherwise enter the sdist.
# The shared hook extends that exclusion set for the build (and stages the
# wheel's frontend tree per-file); it does not reparent the frontend for the
# sdist, which keeps its normal layout.
[tool.hatch.build.targets.sdist.hooks.custom]
path = "scripts/hatch_build_qubit.py"
