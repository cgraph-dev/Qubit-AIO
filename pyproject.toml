[project]
name = "qubit-voicebridge"
version = "1.0.0"
description = "Qubit Agent (Qubit VoiceBridge) — local push-to-talk voice agent: Moonshine ASR, Silero VAD, voice-ID, local LLM, piper TTS — 5 GB VRAM budget."
readme = "README.md"
# The project's own LICENSE is the Qubit VoiceBridge Educational Project
# License: it applies ONLY to original Qubit material (see the root LICENSE
# file and docs/LICENSING.md). Third-party/upstream-derived material remains
# under its original license and is recorded in THIRD_PARTY_NOTICES.md and
# docs/UPSTREAM_REUSE.md. The repository as a whole is not an OSI-approved
# open-source project.
license = { text = "Qubit VoiceBridge Educational Project License — Copyright © 2026 Qubit by Tricky; applies only to original Qubit material. Third-party/upstream-derived material remains under its original license; see LICENSE, docs/LICENSING.md, and THIRD_PARTY_NOTICES.md." }
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
# Python floor is 3.12, not 3.11: the product uses PEP 701 f-strings (e.g.
# voicebridge/local_llm.py) and scripts/install.sh creates the venv with
# `uv venv --python 3.12`. Declaring 3.11 let pip/uv build a 3.11 environment
# where `qubit run` dies at import with SyntaxError; the metadata now matches
# the interpreter the product actually supports and installs.
requires-python = ">=3.12"
dependencies = [
    "sherpa-onnx>=1.13",      # Moonshine ASR + Silero VAD + eres2net voice-ID + Kokoro
    "sounddevice>=0.4",       # mic capture + playback (PortAudio)
    "numpy>=1.24",            # 2.5-safe audio handled by voicebridge/audio/sndcompat.py
                              # (sounddevice 0.5.6 uses the deprecated in-place shape set)
    "cloudpickle>=3.0",       # serialize broker callable-tool closures for forkserver isolation
    "pyyaml>=6",
    "piper-tts>=1.2",         # default TTS
    "faster-whisper>=1.1",    # optional ASR fallback (asr.provider: whisper)
    "webrtcvad>=2.0.10",      # optional VAD fallback (vad.backend: webrtc)
    # webrtcvad imports the legacy pkg_resources API at import time. The
    # default VAD backend is silero, but when the silero model is absent (a
    # stock install before model download) voicebridge/audio/vad.py falls back
    # to webrtcvad, so the runtime import would fail with ModuleNotFoundError:
    # pkg_resources. scripts/install.sh already installs setuptools<81 for
    # exactly this reason; declare it here so every install path (pip/uv/wheel,
    # not just the repo installer) gets a working runtime.
    "setuptools<81",
    "onnx>=1.14",             # Parakeet ONNX metadata patcher (scripts/install.sh) + guarded sherpa fallback
    "playwright>=1.49",       # browser inbox reader (Gmail/IG/FB/TikTok via persistent profiles)

    # --- Qubit-owned runtime (vendored fork in qubit_runtime/) ----------------
    # The product's agent loop/CLI/dashboard execute from the vendored fork
    # (docs/archive/2026-09-21/QUBIT_OWNER_AMENDMENT_2026-09-11_HERMES_RUNTIME.md). These are the
    # pinned upstream core dependencies (qubit_runtime/pyproject.toml), declared
    # here so a clean install runs the runtime with no external upstream install.
    "openai==2.24.0",
    "certifi==2026.5.20",
    "python-dotenv==1.2.2",
    # OS certificate-store trust injection at process start (agent/ssl_verify.py);
    # certifi stays declared too, but truststore is the trust source.
    "truststore==0.10.4",
    "fire==0.7.1",
    "httpx[socks]==0.28.1",
    "rich==14.3.3",
    "tenacity==9.1.4",
    # Preserve relative dependency paths in staged plugin metadata (PM writes).
    "tomli-w==1.2.0",
    "ruamel.yaml==0.18.16",
    "requests==2.33.0",
    "jinja2==3.1.6",
    "firecrawl-anydoc==0.2.4",
    "pydantic==2.13.4",
    "prompt_toolkit==3.0.52",
    "croniter==6.0.0",
    "snowballstemmer==3.1.1",
    "packaging==26.0",
    "Markdown==3.10.2",
    "PyJWT[crypto]==2.13.0",
    "urllib3>=2.7.0,<3",
    "cryptography==50.0.1",
    "psutil==7.2.2",
    "pathspec==1.1.1",
    "fastapi>=0.104.0,<1",
    "uvicorn>=0.31.0,<1",
    # uvicorn's [standard] extra is intentionally not used: uvloop cannot build
    # on Android/Termux. Declare the working components inline (mirrors the
    # vendored qubit_runtime/pyproject.toml and upstream's security model).
    "httptools>=0.6.3,<0.9",
    "watchfiles>=0.20,<2",
    "python-multipart>=0.0.9,<1",
    "ptyprocess>=0.7.0,<1; sys_platform != 'win32'",
    "Pillow==12.3.0",
    # HEIF/HEIC/AVIF decode for the vision tools (registers a Pillow opener).
    "pillow-heif>=1.4.0,<2",
    # SVG renderer for the icon generator used by source builds.
    "resvg-py==0.4.0",
    "websockets==15.0.1",
]

[project.optional-dependencies]
hotkey = ["pynput>=1.7"]
edge = ["edge-tts>=6"]
kokoro = []                   # Kokoro TTS ships inside sherpa-onnx; model download only
# The v0.21.5 vendored runtime eagerly constructs a native Anthropic client in
# `agent.agent_init._init_anthropic_client`, and the vendored test suite asserts
# on real SDK client shape. The SDK is an optional *runtime* extra upstream
# (`qubit_runtime/pyproject.toml` -> `anthropic = [anthropic==0.87.0]`), but the
# test environment must carry it at the same reviewed pin or every
# `AIAgent(provider="anthropic", ...)` test dies at
# `agent/anthropic_adapter.py:63` (PM cannot lazy-install: `pm-runtime` is not in
# the product venv). Keep the pin identical to the vendored extra/test group.
#
# The v0.21.5 vendored suite also imports, at module import time, three deps
# that are optional at runtime and therefore absent from `[project].dependencies`:
#   * `mcp` -- the MCP SDK (`qubit_runtime/pyproject.toml` -> `mcp` extra and the
#     upstream `dev` dependency-group). `tools/mcp_tool.py` binds the sampling
#     types lazily, so `tests/tools/test_mcp_tool.py` needs the real package.
#   * `jsonschema` -- `tools/schema_sanitizer.py` selectors validate with it
#     (`tools/tool_search_validation.py` / `delegation_output_schema.py` import it
#     lazily with a fallback); `tests/tools/test_schema_boolean_required.py`
#     imports it directly. Upstream declares it nowhere; the pin matches the
#     version `mcp==2.0.0` resolves against.
#   * `fal-client` -- the optional Fal image/video provider SDK
#     (`qubit_runtime/pyproject.toml` -> `fal` extra), imported directly by
#     `tests/tools/test_fal_sdk.py`.
# Declaring them here keeps the vendored suite collectible without weakening the
# tests (no `importorskip`) to match upstream's unconditional imports.
test = [
    "pytest>=8",
    "anthropic==0.87.0",
    "mcp==2.0.0",
    "jsonschema==4.26.0",
    "fal-client==0.13.1",
]

[project.scripts]
# Canonical public launcher: `qubit` (all user docs reference this name).
# `voicebridge` remains only as a compatibility alias (same parser/backend).
qubit = "voicebridge.cli:main"
voicebridge = "voicebridge.cli:main"
qubit-dev = "voicebridge.terminal:main"
# Direct launcher for the vendored Qubit-owned runtime (same backend the
# `qubit agent …` subcommand and the dashboard dispatch to). The legacy
# single-query runner (upstream `hermes-agent`) honors argv
# (`--help`/`--version`/`--query`); `qubit` remains the full CLI.
qubit-agent = "voicebridge.qubit_runtime:legacy_entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voicebridge"]
# The built Qubit dashboard (frontend/qubit-dist) is generated from
# frontend/qubit-web with `npm run build` (see frontend/qubit-app/
# README.md and scripts/build_dashboard.sh). It is a build artifact, so it
# is listed under `artifacts` (hatchling only ships VCS-ignored paths when
# they are declared here) — a clean wheel install then serves the real
# dashboard without any checkout or untracked file.
#
# Reproducibility (Wave 5): a clean git clone does NOT contain
# frontend/qubit-dist (it is git-ignored), so a wheel/sdist built from a bare
# clone is dashboard-less. scripts/install.sh and scripts/clean_install_check.sh
# therefore build it deterministically when node/npm are available and fail
# with a TYPED degradation otherwise; scripts/release_qualify.py rejects a
# dashboard-less artifact. The release sdist (built from a tree that already
# carries frontend/qubit-dist) ships the bundle, so downstream wheel rebuilds
# need no npm. See docs/CLEAN_CLONE_AUDIT_WAVE5.md.
artifacts = ["frontend/qubit-dist"]

# The wheel force-includes the frontend tree for the packaged dashboard.
# Hatchling `exclude` does not filter `force-include`, so a custom build hook
# (scripts/hatch_build_qubit.py) stages `frontend/` as a filtered per-file
# mapping. A dirty working-tree build must never embed node_modules (git-ignored
# but walked by `force-include`) or its placeholder user-home paths into the wheel.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "scripts/hatch_build_qubit.py"

# Ship the runtime resources inside the wheel so a clean install (no checkout)
# can resolve the dashboard frontend, config examples, prompt dialogs, task
# templates, report templates, and systemd units (Packet 8K). voicebridge/
# resources.py resolves package data first, then the checkout path when run
# from a repository. No files are duplicated in the repo.
[tool.hatch.build.targets.wheel.force-include]
# NOTE: the ``frontend`` tree is force-included by the custom build hook
# (scripts/hatch_build_qubit.py) as a filtered per-file mapping, because a raw
# directory mapping would sweep the git-ignored node_modules tree into the wheel.
"templates" = "voicebridge/_data/templates"
"config/dialogs.md" = "voicebridge/_data/config/dialogs.md"
# ship the PORTABLE example as the installed default; the developer's personal
# task-templates.yaml is never shipped (Packet 8K private-state rule).
"config/task-templates.example.yaml" = "voicebridge/_data/config/task-templates.yaml"
"config/local-actions.example.yaml" = "voicebridge/_data/config/local-actions.example.yaml"
"config/release-signer.example.fingerprint" = "voicebridge/_data/config/release-signer.example.fingerprint"
"config/voice.example.yaml" = "voicebridge/_data/config/voice.example.yaml"
# curated user guide for the dashboard /docs page (no secrets, no
# machine-specific paths; secret-scanned like the rest of the tree).
# The docs reorg (2026-09-21) moved the source docs under
# docs/archive/2026-09-21/; the installed resource names/destinations are
# unchanged so voicebridge/resources.py and install-time readers keep working.
"docs/archive/2026-09-21/HowTo.md" = "voicebridge/_data/docs/HowTo.md"
"docs/archive/2026-09-21/AUDIO_SETUP.md" = "voicebridge/_data/docs/AUDIO_SETUP.md"
"docs/archive/2026-09-21/VOICE_BRIDGE_SYSTEM.md" = "voicebridge/_data/docs/VOICE_BRIDGE_SYSTEM.md"
"docs/archive/2026-09-21/QUBIT_MIGRATION.md" = "voicebridge/_data/docs/archive/2026-09-21/QUBIT_MIGRATION.md"
"systemd" = "voicebridge/_data/systemd"

# --- Qubit-owned runtime (Packet 8U, owner amendment 2026-09-11) ----------
# A clean install ships the runtime subset under
# ``voicebridge/_data/qubit_runtime`` — the path
# ``voicebridge.qubit_runtime.runtime_root()`` resolves first, before the
# checkout. The fork's tests/, apps/, website/, contributors/, evals/,
# lockfiles and other non-runtime material are intentionally NOT packaged.
# Hatchling force-include walks each mapped directory recursively but does not
# support globs, so the runtime dirs are mapped individually and the fork's
# top-level modules are listed explicitly.
"qubit_runtime/qubit_cli" = "voicebridge/_data/qubit_runtime/qubit_cli"
