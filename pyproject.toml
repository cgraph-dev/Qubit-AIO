# ``qubit_runtime.status()`` reads the provenance manifest from the canonical
# generated location (docs/generated/) with the frozen archive as read-only
# fallback (see voicebridge/qubit_runtime.manifest_path()); ship the canonical
# manifest at the archive destination so a clean install reports
# upstream_revision/patched/file_count.
"docs/generated/QUBIT_HERMES_VENDOR_MANIFEST.json" = "docs/archive/2026-09-21/QUBIT_HERMES_VENDOR_MANIFEST.json"
# Wave 5: ship the small, secret-free matrices/docs that install-time code
# reads. They land under package data so the resolver can reach them with the
# installed path preferred and the checkout as fallback. voicebridge/
# capability_catalog.py and voicebridge/portable.py must resolve these through
# ``voicebridge.resources`` (reported as a cross-boundary repair) — a wheel-root
# ``docs/`` mapping is not permitted by the packaging contract. The source
# docs moved under docs/archive/2026-09-21/ in the 2026-09-21 reorg; the
# installed resource names (``docs/<name>``) are unchanged so
# voicebridge/capability_catalog.py and voicebridge/portable.py resolve them.
"docs/archive/2026-09-21/PARITY_HERMES.json" = "voicebridge/_data/docs/PARITY_HERMES.json"
"docs/archive/2026-09-21/MATRIX_8T_F.json" = "voicebridge/_data/docs/MATRIX_8T_F.json"
"docs/archive/2026-09-21/MIGRATIONS.md" = "voicebridge/_data/docs/MIGRATIONS.md"

[tool.hatch.build.targets.sdist]
# The generated dashboard build ships in the sdist too (reproducible build
# from the sdist without a separate npm build). Requires the bundle to have
# been built before packaging; scripts/install.sh builds it deterministically
# from a clean clone when node/npm are available and otherwise fails typed
# (see the wheel comment above and docs/CLEAN_CLONE_AUDIT_WAVE5.md).
artifacts = ["frontend/qubit-dist"]
# NEVER ship the developer's live config, private browser state, or accidental
# dirty/untracked files (Packet 8K "no private developer state in the release").
# The sdist carries the portable example config only.
exclude = [
  "config/voice.yaml",
  "config/voice.local.yaml",
  # the developer's personal template set stays out of the release
  "config/task-templates.yaml",
  # developer's personal knowledge + model file stay out of the release
  "config/personal-knowledge.md",
  "Modelfile.qubit",
  # internal dev change reports carry machine-specific history; not needed to
  # build, run, or test the release
  "docs/CHANGE_REPORTS",
  # the 2026-09-22 docs reset archived the pre-reset docs here; they are
  # internal history (some carry a developer home path) and must not ship.
  "docs/archive/2026-09-22-pre-reset",
  # working-tree documents the developer edits in parallel with packaging; they
  # carry machine-specific history and must not ship (Packet 8K sdist privacy)
  "docs/UNIFIED_AGENT_PLAN.md",
  # internal migration/audit/evidence notes that record the developer's real
  # home path; excluded from the sdist so the release carries no developer
  # home path (the repo retains the provenance records). Sanitizing the source
  # docs remains the owning agent's follow-up.
  "docs/8TF_COMPLETE_MIGRATION_PLAN.md",
  "docs/8TF_SOURCE_OF_TRUTH.md",
  "docs/AUDIT_OPENCLAW_2026-09-11.md",
  "docs/AUDIT_OPENCLAW_V2026_9_4_DELTA.md",
  "docs/BAKEOFF_4D.json",
  "docs/BAKEOFF_4D.md",
  "docs/OPERATIONS_8S.md",
  "docs/archive/2026-09-21/QUBIT_COMPLETION_EVIDENCE.md",
  "docs/archive/2026-09-21/QUBIT_FINAL_CODE_READY_PROMPT.md",
  "docs/OPERATOR_QUALIFICATION.md",
  "docs/SECURITY_AUDIT_WAVE4.md",
  # Wave 5: an untracked agent wave prompt is swept into the sdist by the
  # working-tree build; it is internal and carries the developer home path, so
  # exclude it (a clean release is built from a committed tree anyway).
  "docs/archive/2026-09-21/QUBIT_BYTE_PARITY_VERIFICATION_PROMPT.md",
  # Wave 2 (full-parity): internal agent reports/evidence that are untracked
  # working-tree artifacts. They are not product docs, and one carries a real
  # developer home path, so they must never be swept into the release sdist.
  "docs/archive/2026-09-21/QUBIT_QBPV2_PACKAGING.md",
  "docs/archive/2026-09-21/QUBIT_QBPV_PACKAGING_SECURITY.md",
  "docs/archive/2026-09-21/QUBIT_BYTE_PARITY_EVIDENCE.md",
  "docs/archive/2026-09-21/QUBIT_REACHABILITY_AUDIT.md",
  # Wave 2 (Agent 5 re-audit): untracked internal evidence/allowlist docs swept
  # into the sdist by a working-tree build. QUBIT_WAVE2_EVIDENCE.md carries a
  # real developer home path, so the release must not ship either file.
  "docs/archive/2026-09-21/QUBIT_WAVE2_EVIDENCE.md",
  "docs/archive/2026-09-21/QUBIT_REBRAND_ALLOWLIST.md",
  # untracked agent execution prompt swept in by a working-tree build; carries
  # a real developer home path, so the release must not ship it.
  "docs/archive/2026-09-21/QUBIT_PROVIDER_VOICE_EXECUTION_PROMPT_2026-09-15.md",
  # Living docs and generated evidence that record the developer's real home
  # path (reference install / project-root provenance). They stay in the repo;
  # the release sdist must carry no developer home path (Packet 8K sdist
  # privacy; enforced by tests/test_packaging_wave3.py).
  "docs/DECISIONS.md",
  "docs/PARITY.md",
  "docs/QUBIT_OWNER_AMENDMENT_2026-09-22_STAGED_GATES_AND_RULINGS.md",
  "docs/QUBIT_OWNER_AMENDMENT_2026-09-23_W9_VENDOR_SYNC.md",
  "docs/QUBIT_RESET_IMPLEMENTATION_STRATEGY_PROMPT_2026-09-22.md",
  "docs/QUBIT_VENDOR_DELTA_2026-09-22.md",
  "docs/STATUS.md",
  "docs/generated/QUBIT_DASHBOARD_AUDIT_2026-09-23.json",
  "docs/generated/QUBIT_SOURCE_INVENTORY.json",
  "docs/generated/parity_inventory.json",
  # Newly generated controls E2E evidence (untracked working-tree artifact)
  # also records the developer home path; exclude it like the other generated
  # evidence (Packet 8K sdist privacy).
  "docs/generated/QUBIT_CONTROLS_E2E_2026-09-23.json",
  # The 2026-09-21 docs reorg relocated the internal evidence/prompt docs under
