# Daily-task templates — spoken phrase → known task text for OpenClaw/Hermes.
# A matched template dispatches instantly (deterministic, 0 model tokens).
# Edit freely: add your own recurring tasks. Restart the bridge after editing.
#
# Fields:
#   name  – short id (used in logs)
#   match – regex(es), case-insensitive; any() wins. Use ^...$ or \b...\b for precision.
#   kind  – coding (OpenClaw) | hermes (Hermes CLI) | conversation (local model)
#   task  – the exact task text sent to the agent (battle-tested wording)
#   ack   – short spoken ack, optional
#
# NOTE: destructive phrasing still goes through the safety policy; templates
# only speed up SAFE, KNOWN tasks.

templates:
  # ---------------------------------------------------------------- projects
  - name: projects-status
    match:
      - "check (my )?(projects|repos|repositories) (status|state)"
      - "status of (my )?projects"
      - "what('s| is) the (status|state) of (my )?projects?"
    kind: coding
    task: >
      Inspect ~/Projects/Repos/ and list the main projects with: current git
      branch, dirty/uncommitted changes, and how many commits ahead/behind
      origin. Report each project on one line, keep it concise.
    ack: "Checking your projects."

  - name: cgraph-status
    match:
      - "cgraph (status|state)"
      - "how('s| is) cgraph (going|doing|looking)"
      - "(update|news) on cgraph"
    kind: coding
    task: >
      Check the CGraph monorepo at ~/Projects/Repos/CGraph Umbrella/: git status,
      branch, uncommitted changes, and whether cgraph-web is deployed (Vercel).
      Summarize in 3-4 short lines.
    ack: "Checking CGraph."

  # ------------------------------------------------------------------- voice
  - name: bridge-status
    match:
      - "(voice )?(bridge|assistant) (status|health|state)"
      - "are you (ok|okay|fine|healthy|working|up)"
      - "is the bridge (working|up|ok)"
    kind: conversation
    task: "Report your own status: ASR engine, model, gateway route, in one sentence."
    ack: ""

  # -------------------------------------------------------------- reminders
  - name: what-day
    match:
      - "what (day|date) is (it|today)"
      - "what('s| is) today('s)? (date|day)"
      - "what time is it"
    kind: conversation
    task: "Say today's date and current local time (Europe/Bucharest) in one short sentence."
    ack: ""

  - name: daily-plan
    match:
      - "(what('s| is)|make|show|give me) (my |the )?(daily )?(plan|schedule|agenda)"
      - "what do i (have|need) (to do|today)"
    kind: coding
    task: >
      Read today's notes in ~/.openclaw/workspace/memory/ and any TODO/plan files
      in ~/Projects/Repos, and list the user's top 3-5 items for today. If nothing
      is found, say so and suggest asking for a plan.
    ack: "Pulling up your plan."

  # ------------------------------------------------------------------ git
  - name: git-sync
    match:
      - "(sync|push|publish) (my )?changes"
      - "(commit and push|git push)"
      - "sync (the )?(repo|repository)"
    kind: coding
    task: >
      For the CURRENT project in ~/Projects/Repos (or the one the user just
      mentioned): review uncommitted changes, write a clear conventional commit
      message, commit, and push to origin. Do NOT force-push. Report the commit
      hash and branch.
    ack: "Syncing your changes."

  # --------------------------------------------------------------- research
  - name: research-current
    match:
      - "(use )?perplexity to (search|find|look up|check)"
      - "search (the )?(web|internet) for"
      - "what('s| is) the (latest|current) news (on|about)"
    kind: conversation
    task: "Answer from current web search, concise."
    ack: ""

  # -------------------------------------------------------------- email / DMs
  # NOTE: these need the executor's mail/DM integration configured first
  # (Hermes: himalaya IMAP or google-workspace; OpenClaw: whatsapp extension).
  # ask_executor must be ON so the bridge asks who should check.
  - name: check-email
    match:
      - "(check|read|look at|open|scan|review) (my |the )?(email|inbox|mails|messages? in (my )?inbox)"
      - "(any|do i have) (new|important|unread) (email|emails|mail)"
      - "(what's|what is) (new|important|unread) in (my )?inbox"
      - "verify my emails"
    kind: coding
    task: >
      Check the user's email inbox. List any NEW messages and flag which ones
      look IMPORTANT (sender, subject, why it matters — urgent deadlines,
      payment/account notifications, replies waiting on the user). Summarize
      in 3-5 short lines. If email access is not configured, say exactly what
      is needed to enable it.
    ack: "Checking your email."

  - name: check-dms
    match:
      - "(check|read|look at|open|scan|review) (my )?(private )?(messages|dms?|inbox)"
      - "(any|do i have) (new|unread) (messages|dms?|private messages)"
      - "(check|see|look at) (my )?(whatsapp|discord|instagram|telegram|signal)"
    kind: coding
    task: >
      Check the user's private messages / DMs (WhatsApp, Discord, or whichever
      platform is configured). List new messages and flag anything IMPORTANT
      (time-sensitive, actionable, from key contacts). Summarize in 3-5 short
      lines. If a platform is not configured, say exactly what is needed.
    ack: "Checking your messages."

  # ----------------------------------------------------- vision / web / video
  - name: look-at-image
    match:
      - "(look at|check|read|see|analyze|view|inspect) (this |that |the |an |a )?(image|picture|photo|screenshot|png|jpg)"
      - "(what'?s|what is) (in|on|shown in) (this |that |the )?(image|picture|photo|screenshot)"
      - "read (the |this )?(text )?(from|in) (this |the )?image"
      - "(analyze|describe|look at) (my |the )?screenshot"
    kind: coding
    task: >
      The user wants you to look at an image (screenshot, photo, or file they
      will point you to — check ~/Pictures or /tmp for recent screenshots if
      no path is given). Use your vision capability to describe what's in it
      and answer their question about it. If they asked to read text, extract
      the text accurately. Reply concisely in 2-4 sentences.
    ack: "Looking at the image."

  - name: watch-video
    match:
      - "(watch|analyze|look at|check|view|see) (this |that |the |a )?(video|clip|recording)"
      - "(what'?s|what is) (happening|going on) in (this |that |the )?video"
      - "(summarize|describe) (this |that |the )?video"
    kind: coding
    task: >
      The user wants you to analyze a video (they will give a path or URL, or
      check recent captures in ~/Videos or /tmp). Use your video analysis
      capability to describe what happens and answer their question. Reply
      concisely in 2-4 sentences.
    ack: "Watching the video."

  - name: read-website
    match:
      - "(read|check|look at|open|fetch|summarize|analyze) (this |that |the |a )?(website|webpage|page|site|url|link)"
      - "(what'?s|what is) (on|at) (this |that |the )?(website|webpage|page|url)"
      - "(check|read) (the )?(latest|current) (article|post|page)"
    kind: coding
    task: >
      The user wants you to look at a website or webpage (they will give a URL,
      or check the browser for the current page). Fetch it, extract the key
      content, and summarize what's there or answer their question. Reply
      concisely in 2-4 sentences.
    ack: "Reading the page."

  - name: vscode-task
    match:
      - "(use|open|work in|work on) (the )?(vscode|vs code|editor|ide) (to|and|on)"
      - "(open|look at|review|fix|edit|refactor|inspect) (the )?(code|project|repo) (in|with|using) (vscode|vs code|the editor)"
      - "agent (should|shouldn'?t|can|to) use (the )?vscode"
    kind: coding
    task: >
      The user wants coding work done with VS Code in the loop. Use the VS Code
      CLI (code --reuse-window <path>) to open relevant files/projects, inspect
      them, and do the requested edits. Use your full tool set (files,
      terminal, browser, repos). Reply concisely with what was done.
    ack: "Using VS Code."

  # ---------------------------------------------------------- CGraph graph
  - name: graphify-query
    match:
      - "(query|ask|search|look up|check) (the |in )?(cgraph )?(knowledge )?graph"
      - "(what|who|how|where) (is|are|does|connects|links|relates) .*(in|across|within) (the )?(cgraph )?(codebase|repo|project|graph)"
      - "(what|how) (connects|links|relates|is) .*(to|with|and) (the |the )?(web|backend|api|socket|chat|logger|stripe|packages)"
      - "graphify"
      - "(find|trace) (the )?(call|dependency|path|import|relation).*(cgraph|in the codebase)"
      - "(what does|how does) (the )?(web app|backend|api client|stripe|socket|logger|chat) (do|work|connect)"
    kind: coding
    task: >
      Answer the user's architecture question about the CGraph codebase using
      the prebuilt knowledge graph. Run the query wrapper:
        ~/Projects/Repos/CGraph-graphify/graphify-query.sh "<the user's question>"
      For path queries: graphify-query.sh path "<from>" "<to>".
      For a single node: graphify-query.sh explain "<label>" (e.g. stripe.tsx,
      api-client.ts, socket-manager.ts).
      The graph has 12k+ nodes (web, backend, packages) with descriptions.
      Answer in 2-4 short sentences based on what the graph returns.
    ack: "Checking the code graph."
