# Qubit VoiceBridge — portable example configuration.
# Install copies this to ~/.config/qubit-voicebridge/voice.yaml on a fresh
# machine (scripts/install.sh). Every value is optional; the bridge has sane
# defaults. Tune AFTER first boot: mic levels, silence timing, keys.
#
# Per-machine overrides (mic layout, device names, themes) live ONLY in your
# user config — portable examples never describe specific hardware.
#
# Environment overrides use double underscores between levels so keys that
# contain underscores stay addressable, e.g.
#   VOICE_BRIDGE__INTENT__LOCAL_LLM__MODEL=qubit-brain4
# Legacy single-underscore form still works but cannot reach such keys.

# ---------------------------------------------------------------------------
# Audio output — optionally PIN the TTS to a specific device (e.g. your
# headphones) so GNOME's default-sink choice can't route audio to a quiet/wrong
# device. `output_device` is a sounddevice device index (run `voicebridge status`
# or python -c "print(sounddevice.query_devices())" to see them). "" = system default.
audio:
  output_device: ""         # e.g. 4 = motherboard ALC892 headphone jack (index SHIFTS on profile change)
  output_device_name: ""    # more robust: match by name substring, e.g. "ALC892 Analog"
  output_volume: 80          # percent, applied + unmuted on boot

# ---------------------------------------------------------------------------
# Push-to-talk hotkeys
hotkey:
  hold_key: ctrl_r        # hold to talk (ends on release); quick tap = toggle
  tap_ms: 300             # press shorter than this counts as a tap (toggle listen)
  toggle_no_speech_s: 5.0 # toggle stops itself if you don't speak
  interrupt_on_ptt: true  # Ctrl while a task runs = PAUSE + listen for new instruction
  alt_hold_key: ""        # optional second hold key
  tap_cancel: esc         # tap while assistant speaks -> stop speech / cancel task

# ---------------------------------------------------------------------------
# Microphone
mic:
  device: null            # null = system default input
  sample_rate: 48000      # device rate; resampled to 16 kHz for ASR
  channels: 1             # mono input is the norm (USB headsets); use the loudest channel
  blocksize: 480          # ~10 ms at 48 kHz
  gain: 1.0               # digital pre-amplify; ~3.0 suits most USB headsets (higher adds hiss)
  min_rms: 0.0008
  max_capture_s: 30.0   # watchdog: force-close a wedged mic stream         # below this RMS the capture counts as silence

# Voice activity detection / endpointing
vad:
  enabled: true
  backend: silero         # silero (neural, sherpa-onnx) | webrtc
  silero_model: ""        # empty = <model_dir>/silero_vad_v5.onnx
  aggressiveness: 1       # webrtcvad 0-3 (unused for silero)
  speech_start_ms: 180    # how much continuous speech before "started"
  silence_timeout_s: 0.8  # end-of-turn silence (research: 0.7-0.9s)
  max_utterance_s: 30.0
  rms_gate: 0.004         # frame RMS floor for "voiced" (after gain) — stops hiss triggering VAD
  barge_in: true          # speech while TTS speaks -> cancel output (interrupt)

# Speaker verification (voice-ID): only the ENROLLED voice can barge in.
# Enroll once per machine: `voicebridge enroll` (records 5s) or --file wav.
speaker_verify:
  enabled: true           # no enrollment = old behavior (any speech barges)
  name: user
  threshold: 0.65         # eres2net: self 0.7-0.96 / cross ~0.3
  window_s: 2.0           # analysis window for barge verification
  enroll_seconds: 5

# Audible feedback
feedback:
  beeps: true             # short beep when recording starts/stops

# ---------------------------------------------------------------------------
# Speech-to-text (sherpa-onnx Moonshine: CPU, 0 VRAM, ~0.07s per utterance)
asr:
  provider: sherpa        # sherpa (Moonshine, 0 VRAM CPU) | whisper (fallback)
  engine: parakeet      # sherpa: parakeet v3 (max accuracy, 25 langs) | moonshine (fastest)
  provider_ep: cpu        # sherpa onnxruntime EP: cpu | cuda
  # whisper fallback options (asr.provider: whisper)
  model: base             # tiny|base|small|medium
  compute_type: float16
  language: en
  beam_size: 5
  min_confidence: 0.02    # ~off; empty-text + filler-word checks handle real silence

# ---------------------------------------------------------------------------
# Text-to-speech
tts:
  provider: piper         # piper (fast, local) | kokoro (quality, ~1x realtime CPU) | edge | gateway
  voice: en_US-amy-medium # piper voice (downloaded by scripts/install.sh)
  sample_rate: 22050
  kokoro:
    voice_sid: 0          # Kokoro v0.19 EN: 11 voices, sid 0..10
  interrupt: true
  edge:
    voice: en-US-JennyNeural
    rate: "+0%"
  gateway:
    model: null

# ---------------------------------------------------------------------------
# Intent routing
intent:
  llm_classifier: false   # heuristic router only (fast; ambiguous -> conversation)
  # Packet 4C routing cascade (feature-flagged; default OFF = pre-4C behavior).
  router:
    enabled: false        # true = L0 deterministic rules run before the classifier
    l1_enabled: false     # true = ALSO try CPU semantic matching (nomic-embed-text)
    embed_model: nomic-embed-text
  # Packet 5A opt-in Q5 canary (reversible; default OFF).
  # When ON, scripts/canary_run_4d.py drives the SEPARATE
  # qubit-cand-q5 alias for latency/error/planner/safety/audio
  # logging. Never replaces qubit-brain4; flip off to rollback.
  canary:
    q5_enabled: false
  # Packet 5C live integration (default ON; rollback flag).
  compiler:
    mode: 5c              # 5c = bounded FTS5 compiler wired
                          # into chat turns; 4b = old compiler
    evidence_sources: []  # optional 5A adapter names (bounded)
    observe: true         # surface omissions/failures to the model
  local_llm:
    enabled: true         # bridge answers ALL chat itself (<0.5s); only tasks -> worker sessions
                          # DeepSeek API handles long/complex/web asks
    model: qubit-brain4  # current default local model (English-only replies)
    url: http://127.0.0.1:11434
    timeout_s: 8.0     # local model chat timeout (was 4s — journal showed real timeouts)
    max_tokens: 100
  conversation_backend: local      # bridge answers ALL chat (<0.5s); only tasks -> worker sessions
  templates_path: ~/.config/qubit-voicebridge/task-templates.yaml  # daily-task templates
  deepseek_url: https://api.deepseek.com/chat/completions
  deepseek_model: deepseek-v4-flash
  deepseek_env: ~/.config/qubit-voicebridge/.env     # DEEPSEEK_API_KEY lives here
  # Perplexity: web/current-info questions (requires PERPLEXITY_API_KEY)
  perplexity_enabled: true
  perplexity_url: https://api.perplexity.ai/chat/completions
  perplexity_model: sonar-pro
  perplexity_env: ~/.config/qubit-voicebridge/.env
  # Packet 8Q: optional frontier-provider gateway (DISABLED BY DEFAULT).
  # Enable only with allowlist + budgets + credential refs (env:/file:).
  # Never points at OpenCode's private auth store. Availability and price
  # subject to provider account; never free/unlimited by default.
  frontier:
    enabled: false
    route: local               # local | frontier | auto (auto = opt-in escalation)
    privacy_tier: standard
    allowlist: []              # e.g. ["zen/zai-glio-..."] — owner-curated only
    providers: {}              # e.g. zen: {base_url: ..., key_ref: "env:QUBIT_ZEN_KEY",
                             #   price_in_per_1k: 0.001, price_out_per_1k: 0.002}
    max_tokens: 512
    max_context_chars: 4000
    max_response_chars: 4000
    timeout_s: 20.0
    max_retries: 1
    rpm: 10
    max_concurrency: 2
    daily_usd: 1.0
    monthly_usd: 10.0

# ---------------------------------------------------------------------------
# Qubit agent (native turns + worker sessions; the only task executor)
agent:
  enabled: true
  model: null             # null = Qubit default (qubit-brain4)
  session_prefix: voice
  task_timeout_s: 900
  progress_updates: true
  progress_min_interval_s: 45
# Local PC actions — whitelisted, safe, reversible. Risky actions run as
# supervised worker sessions where the safety policy + confirmations apply.
local:
  enabled: true

# Memory — loaded from the Qubit workspace into the persona prompt
memory:
  enabled: true
  workspace: ~/.config/qubit-voicebridge/workspace
  context_chars: 1500
  save_notes: true

# ---------------------------------------------------------------------------
# Safety
safety:
  enabled: true
  confirm_destructive: true     # spoken confirmation before delete/rm/drop/force-push/etc.
  denylist:
    - "ignore all previous instructions"
    - "disable safety"
  always_confirm: []            # extra patterns that always ask
  never_confirm: []             # patterns that skip confirmation
  dry_run_first: false          # true = coding tasks start as dry runs
  spoken_confirmation: true
  tool_broker: true             # Packet 3A: local actions + script templates run
                                # through the capability broker (argv-only).
                                # false = LEGACY DIRECT PATH: UNSECURED ROLLBACK
                                # ONLY (executions carry no policy decisions) —
                                # never treat or describe this mode as secured.

# Spoken summaries — the local ollama model compresses tool output into ≤40 words.
# provider: ollama uses the local chat model (fast, ~0.3s, smarter feel);
# extractive is the no-model fallback (auto-used if ollama is down).
summarizer:
  provider: ollama              # ollama (local model) | extractive (no model)
  ollama_url: http://127.0.0.1:11434
  ollama_model: qubit-brain4   # the bridge's local chat model
  max_chars: 900
  max_words: 40             # HARD cap on every spoken response (save time)

# ---------------------------------------------------------------------------
# Voice dashboard (web UI): talk from your phone + live activity feed.
#   http://<this-pc-ip>:8890   (chat)   ·   /activity  (agent dashboard)
webui:
  enabled: true
  speak_web_locally: false # browser plays the reply once; keep false to avoid double-speech
  host: 0.0.0.0            # 0.0.0.0 = reachable from the LAN (phone)
  token: ""                # REQUIRED for a non-loopback host: set a long random value
  port: 8890
  script_timeout_s: 60     # local-script tools (e.g. Perplexity search) cap

# ---------------------------------------------------------------------------
logging:
  level: INFO
  jsonl: true               # structured event journal (observability)
  jsonl_path: null          # default: ~/.local/state/qubit-voicebridge/events.jsonl
