# Qubit VoiceBridge — portable example configuration (machine-agnostic).
# Install copies this to ~/.config/qubit-voicebridge/voice.yaml on a fresh
# machine (scripts/install.sh). Every value is optional; the bridge has sane
# defaults. Tune AFTER first boot: mic levels, silence timing, keys.
# Per-machine overrides (mic layout, device names, themes) live ONLY in your
# user config — this example never describes specific hardware.
# See docs/archive/2026-09-21/AUDIO_SETUP.md for the working audio setup.

# ---------------------------------------------------------------------------
# Push-to-talk hotkeys
hotkey:
  hold_key: ctrl_r        # hold to talk (ends on release); quick tap = toggle
  tap_ms: 300             # press shorter than this counts as a tap (toggle listen)
  toggle_no_speech_s: 5.0 # toggle stops itself if you don't speak
  interrupt_on_ptt: true  # Ctrl while a task runs = PAUSE + listen for new instruction
  alt_hold_key: ""        # optional second hold key
  tap_cancel: esc         # tap while assistant speaks -> stop speech / cancel task

# ---------------------------------------------------------------------------
# Microphone
audio:
  output_device: ""        # EMPTY = follow the working default sink (do NOT pin an index)
  output_device_name: ""   # EMPTY = follow default; pinning is machine-specific
  output_volume: 100

mic:
  device: null            # null = system default input
  sample_rate: 48000      # device rate; resampled to 16 kHz for ASR
  channels: 1             # mono USB headset mics are the norm (AUDIO_SETUP rule 2)
  blocksize: 480          # ~10 ms at 48 kHz
  gain: 3.0               # ~3x suits USB headsets; higher amplifies hiss and breaks ASR
  min_rms: 0.0005         # below this RMS the capture counts as silence
  max_capture_s: 30.0     # watchdog: force-close a wedged mic stream

# Voice activity detection / endpointing
vad:
  enabled: true
  backend: silero         # silero (neural, sherpa-onnx) | webrtc
  silero_model: ""        # empty = <model_dir>/silero_vad_v5.onnx
  aggressiveness: 1       # webrtcvad 0-3 (unused for silero)
  speech_start_ms: 280    # how much continuous speech before "started"
  silence_timeout_s: 1.2  # end-of-turn silence (research: 0.7-0.9s; 0.4s cut mid-thought pauses)
  max_utterance_s: 30.0
  rms_gate: 0.0015        # frame RMS floor for "voiced" (after gain) — stops hiss triggering VAD
  barge_in: true          # speech while TTS speaks -> cancel output (interrupt)

# Speaker verification (voice-ID): only the ENROLLED voice can barge in.
# Enrolled: `voicebridge enroll` (records 5s of YOUR voice).
speaker_verify:
  enabled: true           # no enrollment = old behavior (any speech barges)
  name: user
  threshold: 0.65         # eres2net: self 0.7-0.96 / cross ~0.3
  window_s: 2.0           # analysis window for barge verification
  enroll_seconds: 5

# Audible feedback
feedback:
  beeps: true             # short beep when recording starts/stops

# ---------------------------------------------------------------------------
# Speech-to-text (sherpa-onnx Moonshine: CPU, 0 VRAM, ~0.07s per utterance)
asr:
  provider: sherpa        # sherpa (Moonshine, 0 VRAM CPU) | whisper (fallback)
  engine: parakeet
  num_threads: 8      # sherpa: parakeet v3 (max accuracy, 25 langs) | moonshine (fastest)
  provider_ep: cpu        # sherpa onnxruntime EP: cpu | cuda
  # whisper fallback options (asr.provider: whisper)
  model: base             # tiny|base|small|medium
  compute_type: float16
  language: en
  beam_size: 5            # better accuracy than greedy; still <1s on GPU for short clips
  min_confidence: 0.02    # ~off. whisper's avg_logprob for real mic speech is
                          # 0.05-0.2 — a higher gate rejects PERFECT transcripts.
                          # Real "didn't catch" cases: empty text + filler words.

# ---------------------------------------------------------------------------
# Text-to-speech
tts:
  provider: piper          # piper (fast, local) | kokoro (quality, ~1x realtime CPU) | edge | gateway
  voice: en_US-amy-medium # piper voice (downloaded by scripts/install.sh)
  sample_rate: 22050
  kokoro:
    voice_sid: 0          # Kokoro v0.19 EN: 11 voices, sid 0..10
  interrupt: true
  edge:
    voice: en-US-JennyNeural
    rate: "+0%"
  gateway:
    model: null
  openai:
    voice: nova
    model: gpt-4o-mini-tts
    key_env: ~/.config/qubit-voicebridge/.env
    instructions: "Speak with a warm, soft and sexy tone, with a subtle, elegant Japanese accent. Gentle, breathy and intimate, slightly playful — like a caring Japanese girlfriend. Speak naturally, at a relaxed pace, clear and affectionate."

# ---------------------------------------------------------------------------
# Intent routing
intent:
  llm_classifier: true   # LLM fallback for accent/broken-English (user approved ~20% cost); deterministic heuristics run first
  local_llm:
    enabled: true         # bridge answers casual talk itself (<0.5s); rest -> worker sessions
                          # DeepSeek API handles long/complex/web asks
    model: qubit-brain  # Qwen3-4B abliterated (Packet 4B sanitized artifact; /no_think via payload builders)
    url: http://127.0.0.1:11434
    timeout_s: 8.0     # local model chat timeout (was 4s — journal showed real timeouts)
    max_tokens: 100
    # Packet 4B: personal facts come ONLY from the bounded context compiler
    # (user-local personal-knowledge.md via load_core_facts); raw file slices
    # are never injected. Legacy inject_memory key is no longer read.
    num_ctx: 4096         # canonical runner contract (Packet 4B): compiled context + dialogs + history + output reserve fit with headroom

  # EG2 L1.5 augmenter (template: OFF): UNKNOWN-only, with a hard high-risk veto.
  router:
    l1_5_enabled: false    # keep false in this template; opt in only after benchmarking
    l1_5_threshold: 0.87   # minimum max-similarity for an EG2 candidate
    l1_5_margin: 0.002     # required lead over the runner-up
    l1_5_model_dir: ~/.local/share/qubit-voicebridge/models/embeddinggemma-2-onnx  # placeholder: text-only EG2 ONNX model dir

  conversation_backend: local      # bridge answers ALL chat (<0.5s); only tasks -> worker sessions
  templates_path: ~/.config/qubit-voicebridge/task-templates.yaml  # daily-task templates
  deepseek_url: https://api.deepseek.com/chat/completions
  deepseek_model: deepseek-v4-flash
  deepseek_env: ~/.config/qubit-voicebridge/.env     # DEEPSEEK_API_KEY lives here
  # Perplexity: web/current-info questions (requires PERPLEXITY_API_KEY)
  perplexity_enabled: true
  perplexity_url: https://api.perplexity.ai/chat/completions
  perplexity_model: sonar-pro
  perplexity_env: ~/.config/qubit-voicebridge/.env

# ---------------------------------------------------------------------------
# Qubit agent (native turns + worker sessions; the only task executor)
agent:
  enabled: true
  model: null             # null = Qubit default (qubit-brain)
  session_prefix: voice
  task_timeout_s: 900
  progress_updates: true
  progress_min_interval_s: 45

# Local PC actions — whitelisted, safe, reversible. Risky actions run as
# supervised worker sessions where the safety policy + confirmations apply.
local:
  enabled: true

# Memory — loaded from the Qubit workspace into the persona prompt
memory:
  enabled: true
  workspace: ~/.config/qubit-voicebridge/workspace
  context_chars: 1500
  save_notes: true

# ---------------------------------------------------------------------------
# Safety
safety:
  enabled: true
  confirm_destructive: true     # spoken confirmation before delete/rm/drop/force-push/etc.
  denylist:
    - "ignore all previous instructions"
    - "disable safety"
  always_confirm: []            # extra patterns that always ask
  never_confirm: []             # patterns that skip confirmation
  dry_run_first: false          # true = coding tasks start as dry runs
  spoken_confirmation: true

# Spoken summaries — the resident brain (qubit-brain) compresses tool output into ≤40 words.
summarizer:
  provider: ollama              # ollama (local model) | extractive (no model)
  ollama_url: http://127.0.0.1:11434
  ollama_model: qubit-brain  # the bridge's local chat model
  max_chars: 900
  max_words: 40             # HARD cap on every spoken response (save time)

# ---------------------------------------------------------------------------
# Voice dashboard (web UI): talk from your phone + live activity feed.
#   http://<this-pc-ip>:8890   (chat)   ·   /activity  (agent dashboard)
webui:
  enabled: true
  speak_web_locally: false # browser plays the reply once; keep false to avoid double-speech
  host: 0.0.0.0            # 0.0.0.0 = reachable from the LAN (phone)
  port: 8890
  script_timeout_s: 60     # local-script tools (e.g. Perplexity search) cap

# ---------------------------------------------------------------------------
logging:
  level: INFO
  jsonl: true               # structured event journal (observability)
  jsonl_path: null          # default: ~/.local/state/qubit-voicebridge/events.jsonl

# ---------------------------------------------------------------------------
# /chat long-context terminal surface.
# The resolved model profile must declare at least `min_context_tokens` context
# tokens or /chat refuses to open with a typed configuration error. It never
# silently truncates and never falls back to the short-context Brain4 default.
# Point `profile` at a registered high-context API profile (OpenCode, OpenRouter,
# or another configured provider); leave empty to use the active/default profile.
terminal:
  min_context_tokens: 65536
  # profile: ""            # optional: model-profile id used for /chat

# ---------------------------------------------------------------------------
# Agent-runtime alignment (Qubit-owned; mirrors <QUBIT_HOME>/config.yaml).
# This template is copied to ~/.config/qubit-voicebridge/voice.yaml, which the
# voice bridge reads. The vendored agent runtime reads a SEPARATE file,
# <QUBIT_HOME>/config.yaml; the values below are the portable Qubit baseline for
# that runtime (mirror them there, e.g. with `qubit config set`, on a fresh
# host). They are recorded here so a rebrand or a hand-edit cannot reintroduce
# an unregistered toolset name or a journal mode that disagrees with the
# accepted single-writer decision.
agent_runtime:
  # Qubit CLI bundle + the real coordination toolset. Validated against
  # qubit_runtime/toolsets.py: the Qubit-owned `qubit-cli` id shares the
  # canonical CLI bundle, and `kanban` is a real registered toolset (dispatcher
  # guarded). Do NOT use the capital-Q `Qubit-cli` spelling — it is not a
  # registry key.
  toolsets:
    - qubit-cli
    - kanban
  # Accepted SQLite journal mode. The canonical state.db is opened by two
  # Qubit-owned processes (voicebridge + the gateway daemon); on this host the
  # linked SQLite cannot apply WAL safely, so the accepted working choice is
  # DELETE (see STATUS §11). Keeping this in agreement with the on-disk mode
  # removes the config-vs-reality drift the forensic audit flagged.
  database:
    journal_mode: delete
  # platform_toolsets parity is NOT required: the vendored runtime derives each
  # platform's default toolset from the static qubit-<platform> bundles, so the
  # reference's explicit maps only restated those defaults. Add entries here
  # only to override a platform on purpose (every name must be a valid toolset).
  platform_toolsets: {}

# ---------------------------------------------------------------------------
# Update source/channel policy (all optional; see docs/UPDATE.md).
# The canonical resolver is voicebridge/update_channel.py; the git mechanism is
# voicebridge/update_manager.py. Leave these unset to use the defaults below.
#
# update:
#   # Canonical Qubit repository (default destination; channel `stable`,
#   # branch `main`). With no explicit source configured, the updater prefers
#   # this URL; a legacy-branded clone `origin` is overridden by it, and an
#   # `origin` that already points at Qubit is used as-is.
#   remote_url: "https://github.com/cgraph-dev/Qubit-AIO.git"
#   remote: origin                      # git remote NAME to update from (default)
#   branch: main                        # branch to track when following a branch
#   tag: ""                             # optional version tag (e.g. v1.2.3);
#                                       # stable/beta follow tags, canary branch
#   channel: stable                     # stable | beta | canary
#   # repo_root: ""                     # checkout to inspect (defaults to repo)
#   # backup_dir: ""                    # default: <XDG state>/qubit-voicebridge/backups/update

# ---------------------------------------------------------------------------
# Voice typing + voice chat (Qubit overlay; all optional, nothing hardcoded).
# Portable by design: models resolve from THIS config + your local Ollama, so
# a weak PC or a powerful one works with no code change. Empty/"auto" uses the
# machine's configured local model, and a configured-but-missing model falls
# back — so a lower-end or higher-end machine is never stuck on ours.
# voice_edit:
#   enabled: true
#   chat_model: ""            # ""/"auto" = intent.local_llm.model; else a tag
#                             # e.g. a small model on a weak PC / big on a good one
#   detail_model: ""          # model for "explain / in detail / report / joke"
#   detail_cues: []           # extra words that mean "give the full answer"
#   voice_recent_turns: 4     # prior turns the voice chat sees
#   stt_mode: accurate        # accurate (faster-whisper) | streaming
#   stt_model: small          # tiny|base|small|medium|large-v3
#   router: deterministic     # deterministic | brain
#   capture_source: auto      # auto (browser-grade AGC/NS) | raw | aec
#   agc: true                 # speech-aware auto gain on the mic
#   mic_gain: 12.0
#   speak_answers: true       # speak replies aloud
#   history_panel: true       # show the overlay history
#   wake:
#     hold_silence_ms: 900    # trailing silence once speech is established;
#                             # lower is snappier but can split slow speech
#     cue_on_kws: true        # immediate single-note cue when the spotter
#                             # hears the phrase (final beep stays on command)
#
# Local chat wording (applies to the voice brain; both configurable):
# intent:
#   local_llm:
#     temperature: 0.7        # higher = more varied, human answers
#     think: false            # false = no chain-of-thought in replies
#
# Text-to-speech voice (all configurable):
# tts:
#   provider: piper           # piper (fast) | kokoro (natural, slower) |
#                             # edge (natural, cloud) | hybrid | openai
#   voice: en_US-amy-medium
#   kokoro:
#     voice_sid: 1            # Kokoro voice (0..10)
