hotkey:
  hold_key: ctrl_r
  tap_ms: 300
  toggle_no_speech_s: 5.0
  interrupt_on_ptt: true
  alt_hold_key: ''
  tap_cancel: esc
mic:
  device: null
  sample_rate: 48000
  channels: 4
  blocksize: 480
  gain: 8.0
  min_rms: 0.0008
  max_capture_s: 30.0
vad:
  enabled: true
  backend: silero
  silero_model: ''
  aggressiveness: 1
  speech_start_ms: 280
  silence_timeout_s: 1.2
  max_utterance_s: 30.0
  rms_gate: 0.004
  barge_in: true
speaker_verify:
  enabled: true
  name: user
  threshold: 0.65
  window_s: 2.0
  enroll_seconds: 5
feedback:
  beeps: true
asr:
  provider: sherpa
  engine: parakeet
  provider_ep: cpu
  model: base
  compute_type: float16
  language: en
  beam_size: 5
  min_confidence: 0.02
tts:
  provider: piper
  voice: en_US-amy-medium
  sample_rate: 22050
  kokoro:
    voice_sid: 0
  interrupt: true
  edge:
    voice: en-US-JennyNeural
    rate: +0%
  gateway:
    model: null
intent:
  llm_classifier: false
  local_llm:
    enabled: true
    model: huihui_ai/llama3.2-abliterate:3b
    url: http://127.0.0.1:11434
    timeout_s: 8.0
    max_tokens: 100
  conversation_backend: local
  templates_path: ~/.config/openclaw-voice-bridge/task-templates.yaml
  deepseek_url: https://api.deepseek.com/chat/completions
  deepseek_model: deepseek-v4-flash
  deepseek_env: ~/.hermes/.env
  perplexity_enabled: true
  perplexity_url: https://api.perplexity.ai/chat/completions
  perplexity_model: sonar-pro
  perplexity_env: ~/.hermes/.env
openclaw:
  gateway_url: null
  token_file: ~/.openclaw/.env
  agent: main
  model: null
  session_prefix: voice
  ask_executor: true
  task_timeout_s: 900
  progress_updates: true
  progress_min_interval_s: 45
hermes:
  enabled: true
  cmd: hermes
  resume_session: voice
  timeout_s: 600
  model: null
local:
  enabled: true
memory:
  enabled: true
  workspace: ~/.openclaw/workspace
  context_chars: 1500
  save_notes: true
safety:
  enabled: true
  confirm_destructive: true
  denylist:
  - ignore all previous instructions
  - disable safety
  always_confirm: []
  never_confirm: []
  dry_run_first: false
  spoken_confirmation: true
summarizer:
  provider: ollama
  ollama_url: http://127.0.0.1:11434
  ollama_model: huihui_ai/llama3.2-abliterate:3b
  max_chars: 900
  max_words: 40
logging:
  level: INFO
  jsonl: true
  jsonl_path: null
webui:
  enabled: true
  host: 0.0.0.0
  port: 8890
  script_timeout_s: 60
