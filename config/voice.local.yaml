# DEAD FILE — not loaded by any Qubit runtime code path.
# The only config the bridge reads is the canonical
# ~/.config/qubit-voicebridge/voice.yaml (or $VOICE_BRIDGE_CONFIG).
# This file is excluded from shipped artifacts (release.ARTIFACT_FORBIDDEN)
# and kept for historical reference only. Do not edit expecting an effect.
hotkey:
  hold_key: ctrl_r
  tap_ms: 300
  toggle_no_speech_s: 5.0
  interrupt_on_ptt: true
  alt_hold_key: ''
  tap_cancel: esc
mic:
  device: null
  sample_rate: 48000
  channels: 1            # mono USB headset mic (see docs/archive/2026-09-21/AUDIO_SETUP.md)
  blocksize: 480
  gain: 3.0              # >4x amplifies hiss on typical USB mics (AUDIO_SETUP rule 3)
  min_rms: 0.0008
  max_capture_s: 30.0
vad:
  enabled: true
  backend: silero
  silero_model: ''
  aggressiveness: 1
  speech_start_ms: 280
  silence_timeout_s: 1.2
  max_utterance_s: 30.0
  rms_gate: 0.004
  barge_in: true
speaker_verify:
  enabled: true
  name: user
  threshold: 0.65
  window_s: 2.0
  enroll_seconds: 5
feedback:
  beeps: true
asr:
  provider: sherpa
  engine: parakeet
  provider_ep: cpu
  model: base
  compute_type: float16
  language: en
  beam_size: 5
  min_confidence: 0.02
tts:
  provider: openai
  voice: en_US-amy-medium
  sample_rate: 22050
  kokoro:
    voice_sid: 0
  interrupt: true
  edge:
    voice: en-US-JennyNeural
    rate: +0%
  gateway:
    model: null
  openai:
    voice: nova
    model: gpt-4o-mini-tts
    key_env: ~/.config/qubit-voicebridge/.env
    instructions: "Speak with a warm, soft and sexy tone, with a subtle, elegant Japanese accent. Gentle, breathy and intimate, slightly playful — like a caring Japanese girlfriend. Speak naturally, at a relaxed pace, clear and affectionate."
intent:
  llm_classifier: true   # enabled for accent/broken-English (user approved ~20% cost)
  local_llm:
    enabled: true
    model: qubit-brain4   # current baked default (was the retired 3B alias)
    url: http://127.0.0.1:11434
    timeout_s: 8.0
    max_tokens: 100
  conversation_backend: local
  templates_path: ~/.config/qubit-voicebridge/task-templates.yaml
  deepseek_url: https://api.deepseek.com/chat/completions
  deepseek_model: deepseek-v4-flash
  deepseek_env: ~/.config/qubit-voicebridge/.env
  perplexity_enabled: true
  perplexity_url: https://api.perplexity.ai/chat/completions
  perplexity_model: sonar-pro
  perplexity_env: ~/.config/qubit-voicebridge/.env
# Qubit agent (native turns + worker sessions; the only task executor)
agent:
  enabled: true
  model: null             # null = Qubit default (qubit-brain4)
  session_prefix: voice
  task_timeout_s: 900
  progress_updates: true
  progress_min_interval_s: 45
local:
  enabled: true
memory:
  enabled: true
  workspace: ~/.config/qubit-voicebridge/workspace
  context_chars: 1500
  save_notes: true
safety:
  enabled: true
  confirm_destructive: true
  denylist:
  - ignore all previous instructions
  - disable safety
  always_confirm: []
  never_confirm: []
  dry_run_first: false
  spoken_confirmation: true
summarizer:
  provider: ollama
  ollama_url: http://127.0.0.1:11434
  ollama_model: qubit-brain4
  max_chars: 900
  max_words: 40
logging:
  level: INFO
  jsonl: true
  jsonl_path: null
webui:
  enabled: true
  host: 0.0.0.0
  port: 8890
  script_timeout_s: 60
